    <script type="text/babel">
        function playableVideoUrl(url) {
            const u = String(url||"").trim();
            if (!u) return "";
            try {
                const x = new URL(u);
                if (x.hostname.includes("youtube.com") && x.pathname === "/watch") {
                    const id=x.searchParams.get("v"); return id ? "https://www.youtube.com/embed/"+id : u;
                }
                if (x.hostname.includes("youtu.be")) return "https://www.youtube.com/embed/"+x.pathname.replace(/^\/\//,"");
                if (x.hostname.includes("instagram.com")) return u.replace(/\/$/,"") + "/embed";
                return u;
            } catch(e) { return u; }
        }
        
        const firebaseConfig = {
            apiKey: "AIzaSyAYGSK5KtmV-zK3ivYa3__4jI37sGm4NRA",
            authDomain: "truepillar-realty.firebaseapp.com",

        const DEFAULT_SITE_CONTENT = {

        };

        const cleanForFirestore = (value) => JSON.parse(JSON.stringify(value, (key, val) => val === undefined ? null : val));

        const CLOUDINARY_CLOUD_NAME = "he2l7oy3";
        const CLOUDINARY_UPLOAD_PRESET = "truepillar_upload";

        const uploadProjectFile = async (file, folder) => {
            const resourceType = file.type.startsWith("video/") ? "video" : "auto";
            const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

            const response = await fetch(endpoint, { method: "POST", body: formData });
            const result = await response.json();

            if (!response.ok || !result.secure_url) {
                throw new Error(result.error?.message || "Cloudinary upload failed");
            }
            return result.secure_url;
        };

        // ===== GOOGLE ADS FORM REDIRECT =====
        const handleFormSubmitWithRedirect = async (formData) => {
            try {

                await leadsCollection.add({

                });

        };
        window.handleFormSubmitWithRedirect = handleFormSubmitWithRedirect;

        const REGIONS = {

            "Thane": ["Ghodbunder Road", "Majiwada", "Kapurbawdi", "Hiranandani Estate", "Kolshet Road", "Vartak Nagar"],

            "Dombivli": ["Dombivli East", "Palava City", "Manpada", "Thakurli", "Kalyan Road"]
        };

        const CONFIGURATIONS = ["1 BHK", "2 BHK", "3 BHK", "4 BHK", "5 BHK / Penthouse"];
        const DEVELOPMENT_STATUS = ["Ready to Move", "Under Construction", "New Launch"];
        const COMPANY_MAHARERA = "A031272401680";
        const AMENITIES_POOL = ["Premium Clubhouse", "Infinity Swimming Pool", "Modern Gymnasium", "24/7 Multi-tier Security", "High-Speed Elevators", "Grand Entrance Lobby", "Ample Car Parking", "Landscaped Gardens", "Kids Play Area", "100% Power Backup"];


        function AdminSelect({ value, options, onChange, className = "", ariaLabel }) {
            const [open, setOpen] = React.useState(false);
            const rootRef = React.useRef(null);
            const normalizedOptions = options.map(option => typeof option === "string" ? { value: option, label: option } : option);
            React.useEffect(() => {
                if (!open) return;
                const handlePointer = (event) => {
                    if (rootRef.current && !rootRef.current.contains(event.target)) setOpen(false);
                };
                document.addEventListener("mousedown", handlePointer);
                return () => document.removeEventListener("mousedown", handlePointer);
            }, [open]);
            const selectedOption = normalizedOptions.find(option => option.value === value) || normalizedOptions[0] || { value: "", label: "" };
            return (
                <div ref={rootRef} className={`tp-v38-select ${className}`}>
                    <button type="button" className="tp-v38-select-button" aria-label={ariaLabel} aria-expanded={open} onClick={() => setOpen(x => !x)}>
                        <span>{selectedOption.label}</span>
                    </button>
                    {open && (
                        <div className="tp-v38-select-menu" role="listbox">
                            {normalizedOptions.map(option => (
                                <button
                                    type="button"
                                    key={option.value}
                                    role="option"
                                    aria-selected={option.value === selectedOption.value}
                                    className={`tp-v38-select-option ${option.value === selectedOption.value ? "tp-v38-active" : ""}`}
                                    onClick={() => { onChange(option.value); setOpen(false); }}
                                >
                                    {option.label}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const TITLE_PREFIXES = ["The Grand", "Elysian", "Pinnacle", "Aura", "Regency", "Signature", "Golden", "Skyline", "Emerald", "Marquis", "Palazzo", "Imperial", "Sapphire", "Royal", "Oasis", "Vista", "Serene", "Meridian"];
        const TITLE_SUFFIXES = ["Residences", "Towers", "Estates", "Heights", "Manor", "Crest", "Villas", "Gardens", "Gre Greens", "Bay", "Terraces", "Enclave", "Palace", "Courtyard"];
        
        const STOCK_IMAGES = [
            "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=800&q=80"
        ];

        // --- SEARCH & FILTER COMPONENT ---
        function SearchFilterBar({ listings = [], search, setSearch, selectedRegion, setSelectedRegion, selectedSubLocality, setSelectedSubLocality, selectedConfig, setSelectedConfig, selectedStatus, setSelectedStatus }) {
            const [suggestionsOpen, setSuggestionsOpen] = React.useState(false);
            const closeSuggestions = () => setSuggestionsOpen(false);
            return (
                <div className="tp-v23-housing-filter bg-luxury-card border border-neutral-800 p-3 rounded-xl space-y-3 lg:space-y-0 lg:flex lg:gap-0 items-center shadow-xl w-full">
                    <div className="flex-1 min-w-[200px] relative z-[100]" onFocus={()=>setSuggestionsOpen(true)}>
                        <input type="text" placeholder="Search project, location, city, developer..." className="w-full bg-luxury-bg border border-neutral-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-luxury-gold text-white" value={search} onChange={(e)=>{setSearch(e.target.value);setSuggestionsOpen(true)}} />
                        {search.trim() && suggestionsOpen && <div className="absolute left-0 right-0 top-full mt-2 bg-[#111114] border border-neutral-700 rounded-lg shadow-2xl max-h-80 overflow-y-auto">{(()=>{
                            const q=search.toLowerCase(), seen=new Set(), items=[];
                            const add=(type,label,detail)=>{if(label&&label.toLowerCase().includes(q)){const k=(type+label).toLowerCase();if(!seen.has(k)){seen.add(k);items.push({type,label,detail})}}};
                            listings.filter(p=>p.published!==false).forEach(p=>{add("Project",p.title,`${p.subLocality}, ${p.region}`);add("Location",p.subLocality,p.region);add("City",p.region,"All matching projects");add("Developer",p.developer,p.title);add("Address",p.address,p.title)});
                            return items.slice(0,12).length ? items.slice(0,12).map((s,i)=><button type="button" key={i} onClick={()=>{setSearch(s.label);setSuggestionsOpen(false)}} className="w-full text-left px-4 py-3 border-b border-neutral-800 last:border-0 hover:bg-neutral-900 flex gap-3"><span className="text-[9px] uppercase text-luxury-gold border border-luxury-gold/40 rounded px-1.5 py-0.5 h-fit min-w-[58px] text-center">{s.type}</span><span><strong className="block text-sm text-white">{s.label}</strong><small className="text-neutral-500">{s.detail}</small></span></button>) : <div className="px-4 py-4 text-sm text-neutral-500">No matching project or location found.</div>;

        // --- ENQUIRY MODAL / SITE VISIT POPUP ---
        function EnquiryModal({ property, onClose, onSubmitLead, formTitle = "Book a Free Site Visit" }) {
            const [name, setName] = React.useState("");
            const [phone, setPhone] = React.useState("");
            const [email, setEmail] = React.useState("");
            const [notes, setNotes] = React.useState("");
            const [submitting, setSubmitting] = React.useState(false);
            const submit = async (event) => {
                event.preventDefault();
                setSubmitting(true);
                try {
                    await onSubmitLead({
                        id: `lead-${Date.now()}`,
                        clientName: name.trim(), clientPhone: phone.trim(), clientEmail: email.trim(),
                        clientNotes: notes.trim(), assetTitle: property?.title || "General enquiry",
                        assetLocation: [property?.subLocality, property?.region].filter(Boolean).join(", ") || "Mumbai Metropolitan Region",
                        status: "New Lead"
                    });
                    window.location.assign("/confirmation.html");
                } catch (error) {
                    console.error("Unable to save enquiry", error);
                    alert("We could not submit your enquiry. Please try again or call us directly.");
                    setSubmitting(false);
                }
            };
            return <div className="fixed inset-0 z-[1000] bg-black/75 p-4 flex items-center justify-center" role="dialog" aria-modal="true" aria-label={formTitle}>
                <div className="w-full max-w-lg rounded-2xl border border-luxury-gold/40 bg-[#121216] p-6 shadow-2xl max-h-[90vh] overflow-y-auto">
                    <div className="flex items-start justify-between gap-4 mb-5"><div><p className="text-[10px] font-bold tracking-[.2em] text-luxury-gold uppercase">TruePillar Realty</p><h2 className="text-2xl text-white mt-1">{formTitle}</h2><p className="text-sm text-neutral-400 mt-2">{property?.title || "Tell us how we can help you."}</p></div><button type="button" onClick={onClose} className="text-neutral-400 hover:text-white text-2xl leading-none" aria-label="Close enquiry form">×</button></div>
                    <form onSubmit={submit} className="space-y-4"><input required value={name} onChange={e=>setName(e.target.value)} placeholder="Your full name *" className="w-full rounded-lg border border-neutral-700 bg-black/40 px-4 py-3 text-white focus:outline-none focus:border-luxury-gold"/><input required type="tel" value={phone} onChange={e=>setPhone(e.target.value)} placeholder="Mobile / WhatsApp number *" className="w-full rounded-lg border border-neutral-700 bg-black/40 px-4 py-3 text-white focus:outline-none focus:border-luxury-gold"/><input type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="Email address (optional)" className="w-full rounded-lg border border-neutral-700 bg-black/40 px-4 py-3 text-white focus:outline-none focus:border-luxury-gold"/><textarea value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Your requirement or preferred visit time" rows="4" className="w-full rounded-lg border border-neutral-700 bg-black/40 px-4 py-3 text-white focus:outline-none focus:border-luxury-gold"/><label className="flex items-start gap-2 text-xs leading-5 text-neutral-400"><input required type="checkbox" className="mt-1 accent-[#D4AF37]"/> <span>I agree that TruePillar Realty may use my details to respond to this enquiry, as described in the <a href="/privacy-policy" target="_blank" rel="noreferrer" className="text-luxury-gold underline">Privacy Policy</a>.</span></label><button disabled={submitting} className="w-full rounded-lg bg-luxury-gold px-5 py-3 font-bold text-black disabled:opacity-60">{submitting ? "Submitting…" : "Submit Enquiry"}</button></form>
                </div>
            </div>;
        }

        function PropertyCard({ property, onOpenEnquiry, onOpenProject, selectedConfig="" }) {
            const cardProject=normalizeProject(property);
            const cardConfigurations = projectConfigurations(cardProject);
            // Card video must come only from the current configuration media saved in Admin.
            // Do not fall back to legacy project-level links, because removed old videos can otherwise reappear.
            const cardSampleVideo = (
                (cardConfigurations.find(c => Array.isArray(c.sampleVideoLinks) && c.sampleVideoLinks.filter(link => String(link || "").trim()).length)?.sampleVideoLinks || [])
                    .find(link => String(link || "").trim())
                || ""
            );
            const cardAmenities = Array.isArray(property.amenities)
                ? property.amenities.filter(am => String(am || "").trim())
                : [];
            const visibleCardAmenities = cardAmenities.slice(0, 4);
            const hiddenAmenityCount = Math.max(0, cardAmenities.length - visibleCardAmenities.length);
            const initialCardConfig = selectedConfig && projectMatchesConfiguration(cardProject, selectedConfig)
                ? getActiveConfiguration(cardProject, selectedConfig).configuration
                : (cardConfigurations[0]?.configuration || "");
            const [cardSelectedConfig, setCardSelectedConfig] = React.useState(initialCardConfig);
            const activeConfig=getActiveConfiguration(cardProject, cardSelectedConfig);
            const activeConfigLabel = activeConfig.configuration || projectConfigSummary(cardProject);
            const activeArea = activeConfig.carpetArea || projectAreaSummary(cardProject);
            const activePrice = activeConfig.price || projectStartingPrice(cardProject);
            const [cardImage,setCardImage]=React.useState(0);
            React.useEffect(()=>{ if(cardProject.images.length<2)return; const timer=setInterval(()=>setCardImage(i=>(i+1)%cardProject.images.length),2800); return()=>clearInterval(timer); },[cardProject.id,cardProject.images.length]);
            React.useEffect(()=>{ setCardSelectedConfig(initialCardConfig); }, [cardProject.id, initialCardConfig]);
            return (
                <div className="bg-luxury-card rounded-xl overflow-hidden border border-neutral-800 hover:border-luxury-gold/40 transition-all duration-300 group flex flex-col justify-between shadow-xl">
                    <div className="relative overflow-hidden h-64 bg-neutral-900">
                        <img src={cardProject.images[cardImage] || property.image} alt={property.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
