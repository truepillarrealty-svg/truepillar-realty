        const openProjectPdf = (pdf) => {
            try {
                if (!pdf || !pdf.url) return;
                if (!pdf.url.startsWith("data:application/pdf")) { window.open(pdf.url, "_blank"); return; }
                const parts = pdf.url.split(",");
                const meta = parts[0] || "";
                const data = parts.slice(1).join(",");
                let blob;
                if (meta.includes(";base64")) {
                    const binary = atob(data);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    blob = new Blob([bytes], { type: "application/pdf" });
                } else { blob = new Blob([decodeURIComponent(data)], { type: "application/pdf" }); }
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, "_blank");
                setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
            } catch (err) { console.error("PDF open error:", err); alert("Could not open this PDF. Please upload it again."); }
        };

                if (url.includes("youtu.be/")) { const id=url.split("youtu.be/")[1].split(/[?&]/)[0]; return id?`https://www.youtube.com/embed/${id}`:null; }
                if (url.includes("youtube.com/shorts/")) { const id=url.split("/shorts/")[1].split(/[?&]/)[0]; return id?`https://www.youtube.com/embed/${id}`:null; }
                return null;
            } catch(e) { return null; }

        function AdminDashboard({ listings, onAdd, onDelete, onEdit, leads, onDeleteLead, onUpdateLeadStatus, onLogout }) {

            const [formData, setFormData] = React.useState({ id:'', title:'', slug:'', developer:'', reraNumber:'', region:'Navi Mumbai', subLocality:'Kharghar', configuration:'2 BHK', status:'Ready to Move', price:'', image:STOCK_IMAGES[0], images:[], videos:[], sampleVideoLinks:[], highlightVideoLinks:[], floorPlans:[], mapLink:'', nearbyPlaces:[], statusBadge:'', pdfs:[], address:'', carpetArea:'', possession:'', amenities:'', description:'', highlights:'', priceOptionsText:'', configurationsText:'', specificationsText:'', locationAdvantagesText:'', faqsText:'', published:true });
            const [isEditing, setIsEditing] = React.useState(false);
            const [uploadStatus, setUploadStatus] = React.useState("");
            const [isUploading, setIsUploading] = React.useState(false);
            const [mediaConfigIndex, setMediaConfigIndex] = React.useState("");
            const [configMediaDrafts, setConfigMediaDrafts] = React.useState({});

            const parsedConfigurations = () => lines(formData.configurationsText || "").map(row => {
                const parts = row.split("|").map(x => x.trim());
                const name = parts[0] || "";
                const existing = (formData.configurations || []).find(c => String(c.configuration||"").toLowerCase() === name.toLowerCase()) || {};
                return { ...existing, configuration:name, carpetArea:parts[1]||"", price:parts.slice(2).join("|").trim()||"", sampleVideoLinks:existing.sampleVideoLinks||[], highlightVideoLinks:existing.highlightVideoLinks||[], floorPlans:existing.floorPlans||[] };
            }).filter(x=>x.configuration||x.carpetArea||x.price);

            const updateConfigMedia = (configIndex, patch) => {
                const i = Number(configIndex);
                if (!Number.isInteger(i)) return;
                setConfigMediaDrafts(prev => ({
                    ...prev,
                    [i]: {...(prev[i] || {}), ...patch}
                }));
            };

            const selectedMediaBase = mediaConfigIndex === "" ? null : parsedConfigurations()[Number(mediaConfigIndex)] || null;
            const selectedMediaConfig = selectedMediaBase ? {...selectedMediaBase, ...(configMediaDrafts[Number(mediaConfigIndex)] || {})} : null;

            const handleImageUpload = async (e) => {
                const input = e.target;
                const files = Array.from(input.files || []);
                if (!files.length) return;

                const invalid = files.find(file => !file.type.startsWith("image/"));
                if (invalid) {
                    alert("Please select image files only.");
                    input.value = "";
                    return;

<button type="submit" disabled={isUploading} className="w-full bg-luxury-gold hover:bg-luxury-goldHover disabled:opacity-50 disabled:cursor-not-allowed text-black py-3 font-bold uppercase tracking-wider transition rounded shadow-lg mt-2">{isUploading ? "WAIT — UPLOADING FILES..." : (isEditing ? 'Save Revisions' : 'Publish New Flat Listing')}</button>

                                </form>
                            </div>
                            <div className="lg:col-span-2 bg-luxury-card p-6 border border-neutral-800 rounded-xl overflow-x-auto shadow-xl">
                                <h2 className="text-xl mb-4 text-white font-medium border-b border-neutral-900 pb-2">Active Property Listings Inventory ({listings.length})</h2>
                                <table className="w-full text-left text-xs text-neutral-300">
                                    <thead>
                                        <tr className="border-b border-neutral-800 text-neutral-400 uppercase tracking-wider pb-3 font-bold">
                                            <th className="pb-3">Project & Type</th><th className="pb-3">Location Node</th><th className="pb-3">Builder Price</th><th className="pb-3 text-right">Actions</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {listings.map(item => (
                                            <tr key={item.id} className="border-b border-neutral-900/60 hover:bg-neutral-900/10">
                                                <td className="py-3 font-semibold text-white max-w-[220px]">{item.title}<span className="block text-[10px] text-neutral-500 font-light">{item.configuration} • {item.carpetArea}</span>{(()=>{const fields=[item.title,item.developer,item.reraNumber,item.description,item.images?.length,item.pdfs?.length,item.sampleVideoLinks?.length,item.highlightVideoLinks?.length,item.floorPlans?.length,item.mapLink,item.nearbyPlaces?.length];const score=Math.round(fields.filter(Boolean).length/fields.length*100);return <span className={`block text-[10px] mt-1 ${score>=80?'text-emerald-400':score>=50?'text-luxury-gold':'text-red-400'}`}>Project Profile: {score}% Complete</span>})()}</td>
                                                <td className="py-3 text-neutral-400 font-medium">{item.subLocality}, <span className="text-[10px] block text-neutral-500">{item.region}</span></td>
                                                <td className="py-3 text-luxury-gold font-bold text-sm">{item.price}</td>
                                                <td className="py-3 space-x-3 text-right font-medium">
                                                    <button className="text-luxury-gold hover:underline" onClick={() => { setFormData({...normalizeProject(item), amenities:(item.amenities||[]).join(', '), highlights:(item.highlights||[]).join('\n'), priceOptionsText:(item.priceOptions||[]).map(x=>`${x.label} | ${x.value}`).join('\n'), configurationsText:projectConfigurations(item).map(x=>`${x.configuration} | ${x.carpetArea} | ${x.price}`).join('\n'), specificationsText:(item.specifications||[]).map(x=>`${x.label} | ${x.value}`).join('\n'), locationAdvantagesText:(item.locationAdvantages||[]).map(x=>`${x.label} | ${x.value}`).join('\n'), faqsText:(item.faqs||[]).map(x=>`${x.label} | ${x.value}`).join('\n')}); setIsEditing(true); setMediaConfigIndex(""); setConfigMediaDrafts(Object.fromEntries(projectConfigurations(item).map((c,i)=>[i,{sampleVideoLinks:c.sampleVideoLinks||[],floorPlans:c.floorPlans||[]}]))); window.scrollTo({top:0,behavior:'smooth'}); }}>Edit</button>
                                                    <button className="text-red-400 hover:underline" onClick={() => onDelete(item.id)}>Delete</button>
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        function SecureLoginGate({ onLoginSuccess }) {
            const [username, setUsername] = React.useState("");
            const [password, setPassword] = React.useState("");
            const [error, setError] = React.useState(false);

            const executeAuthChallenge = (e) => {
                e.preventDefault();
                if (username === "admin" && password === "truepillar2026") {
                    setError(false);
                    onLoginSuccess();
                } else {
                    setError(true);
                }
            };

            return (
                <div className="py-24 px-6 flex items-center justify-center">
                    <div className="bg-luxury-card border border-neutral-800 p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
                        <div className="text-center space-y-1">
                            <h2 className="text-xl font-bold tracking-widest text-white uppercase">AGENT ACCESS PORTAL</h2>
                            <p className="text-xs text-luxury-textMuted font-light">Enter credentials to review site bookings and buyer requests.</p>
                        </div>
                        {error && (
                            <div className="bg-red-950/40 border border-red-900 text-red-400 text-xs p-3 rounded text-center font-medium tracking-wide">Invalid Password or Username Key.</div>
                        )}
                        <form onSubmit={executeAuthChallenge} className="space-y-4 text-xs text-neutral-300">
                            <div>
                                <label className="block text-neutral-400 mb-1">Username ID</label>
                                <input type="text" placeholder="admin" className="w-full bg-luxury-bg border border-neutral-800 p-3 rounded text-white focus:border-luxury-gold outline-none" value={username} onChange={e => setUsername(e.target.value)} required />
                            </div>
                            <div>
                                <label className="block text-neutral-400 mb-1">Password Key Token</label>
                                <input type="password" placeholder="••••••••" className="w-full bg-luxury-bg border border-neutral-800 p-3 rounded text-white focus:border-luxury-gold outline-none" value={password} onChange={e => setPassword(e.target.value)} required />
                            </div>
                            <button type="submit" className="w-full bg-luxury-gold hover:bg-luxury-goldHover text-black py-3.5 font-bold uppercase tracking-widest transition rounded shadow-lg">Login to CRM Panel</button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- CORE APPLICATION ARCHITECTURE WRAPPER ---
        function App() {
            const [view, setView] = React.useState('home');
            const [activeProject, setActiveProject] = React.useState(null);
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            
            const [listings, setListings] = React.useState([]);
            const [leads, setLeads] = React.useState([]);
            const [cloudReady, setCloudReady] = React.useState(false);

            const [search, setSearch] = React.useState("");
            const [selectedRegion, setSelectedRegion] = React.useState("");
            const [selectedSubLocality, setSelectedSubLocality] = React.useState("");
            const [selectedConfig, setSelectedConfig] = React.useState("");
            const [projectConfigContext, setProjectConfigContext] = React.useState("");
            const [selectedStatus, setSelectedStatus] = React.useState("");
            const [activeEnquiryTarget, setActiveEnquiryTarget] = React.useState(null);

            React.useEffect(() => {
                let projectsLoaded = false;
                let leadsLoaded = false;

                const markReady = () => {
                    if (projectsLoaded && leadsLoaded) setCloudReady(true);
                };

                const unsubscribeProjects = projectsCollection.onSnapshot(async snap => {
                    if (snap.empty && !projectsLoaded) {
                        try {
                            const legacy = await legacyCloudDoc.get();
                            const legacyListings = legacy.exists ? (legacy.data().listings || []) : [];
                            if (legacyListings.length) {
                                const batch = db.batch();
                                legacyListings.forEach(item => {
                                    const normalized = normalizeProject(item);
                                    batch.set(projectsCollection.doc(String(normalized.id)), cleanForFirestore(normalized));
                                });
                                await batch.commit();
                                return;
                            }
                        } catch (migrationError) {
                            console.error("Legacy migration failed", migrationError);
                        }
                    }

                    setListings(snap.docs.map(doc => normalizeProject({ ...doc.data(), id: doc.data().id || doc.id })));
                    projectsLoaded = true;
                    markReady();
                }, err => {
                    console.error("Project sync error", err);
                    alert("Project cloud sync failed. Check Firestore rules.");
                });

                const unsubscribeLeads = leadsCollection.orderBy("createdAt", "desc").onSnapshot(snap => {
                    setLeads(snap.docs.map(doc => ({ ...doc.data(), id: doc.data().id || doc.id })));
                    leadsLoaded = true;
                    markReady();
                }, err => {
                    console.error("Lead sync error", err);
                    leadsLoaded = true;
                    markReady();
                });

                return () => {
                    unsubscribeProjects();
                    unsubscribeLeads();
                };
            }, []);

            React.useEffect(() => {
                if (IS_LOCAL_FILE) return;
                const applyRoute = () => {
                    const route = getRouteFromPath();
                    if (route.type === "project") {
                        const found = listings.find(p => (p.slug || slugify(p.title)) === route.slug);
                        if (found) { setActiveProject(normalizeProject(found)); setView("project"); }
                        else if (cloudReady) { setActiveProject(null); setView("properties"); }
                    } else {
                        setActiveProject(null);
                        setView(route.view);
                    }
                };
                applyRoute();
                window.addEventListener("popstate", applyRoute);
                return () => window.removeEventListener("popstate", applyRoute);
            }, [listings, cloudReady]);

            const navigateView = (nextView) => {
                const paths = { home: "/", properties: "/properties", about: "/about", contact: "/contact", admin: "/admin" };
                setActiveProject(null);
                setView(nextView);
                if (!IS_LOCAL_FILE) window.history.pushState({ view: nextView }, "", paths[nextView] || "/");
                window.scrollTo(0, 0);
            };

            const openProject = p => {
                const n = normalizeProject(p);
                setActiveProject(n);
                setView("project");
                if (!IS_LOCAL_FILE) navigateToProjectUrl(n);
                window.scrollTo(0, 0);
            };

            const closeProject = () => {
                setActiveProject(null);
                setView("properties");
                if (!IS_LOCAL_FILE) window.history.pushState({ view: "properties" }, "", "/properties");
                window.scrollTo(0, 0);
            };

            const saveProject = async (project) => {
                const normalized = normalizeProject(project);
                await projectsCollection.doc(String(normalized.id)).set(cleanForFirestore(normalized), { merge: false });
            };

            const deleteProject = async (id) => {
                await projectsCollection.doc(String(id)).delete();
            };

            const saveLead = async (lead) => {
                const payload = cleanForFirestore({ ...lead, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                await leadsCollection.doc(String(lead.id)).set(payload);
            };

            const deleteLead = async (id) => {
                await leadsCollection.doc(String(id)).delete();
            };

            const updateLeadStatus = async (id, status) => {
                await leadsCollection.doc(String(id)).update({ status });
            };

            const matchingFilteredListings = React.useMemo(() => {
                return listings.filter((item) => {
                    if (item.published === false) return false;
                    const searchText = [item.title,item.address,item.subLocality,item.region,item.developer,item.configuration,projectConfigSummary(item),item.status,item.reraNumber].filter(Boolean).join(" ").toLowerCase();
                    const matchedSearch = searchText.includes(search.toLowerCase());
                    const matchedRegion = selectedRegion === "" || item.region === selectedRegion;
                    const matchedSub = selectedSubLocality === "" || item.subLocality === selectedSubLocality;
                    const matchedConfig = projectMatchesConfiguration(item, selectedConfig);
                    const matchedStatus = selectedStatus === "" || item.status === selectedStatus;
                    return matchedSearch && matchedRegion && matchedSub && matchedConfig && matchedStatus;
                });
            }, [listings, search, selectedRegion, selectedSubLocality, selectedConfig, selectedStatus]);
            const filterPack = { search, setSearch, selectedRegion, setSelectedRegion, selectedSubLocality, setSelectedSubLocality, selectedConfig, setSelectedConfig, selectedStatus, setSelectedStatus };

            return (
                <div className="bg-luxury-bg text-white min-h-screen flex flex-col justify-between">
                    <Navbar currentView={view} setView={navigateView} />
                    {!cloudReady && <div className="fixed top-20 right-4 z-[999] bg-luxury-card border border-luxury-gold text-luxury-gold px-4 py-2 rounded-lg text-xs font-bold shadow-xl">CONNECTING TO CLOUD...</div>}
                    
                    <main className="flex-grow pb-16">
                        {view === 'home' && (
                            <Home 
                                setView={navigateView} 
                                listings={matchingFilteredListings} 
                                onOpenEnquiry={setActiveEnquiryTarget}
                                onOpenProject={openProject}
                                filterState={filterPack} 
                                onSubmitHomeLead={saveLead}
                            />
                        )}
                        {view === 'properties' && (
                            <Properties 
                                listings={matchingFilteredListings} 
                                onOpenEnquiry={setActiveEnquiryTarget}
                                onOpenProject={openProject}
                                filterState={filterPack} 
                            />
                        )}
                        {view === 'project' && activeProject && <ProjectDetail property={activeProject} onBack={closeProject} onOpenEnquiry={setActiveEnquiryTarget} listings={listings} onOpenProject={openProject} selectedConfig={projectConfigContext} />}
                        {view === 'about' && (
                            <div className='py-16 px-6 max-w-5xl mx-auto font-light text-neutral-300 leading-relaxed space-y-12 animate-fadeIn'>
                                <div>
                                    <span className="text-xs uppercase font-bold text-luxury-gold tracking-widest block mb-1">Who We Are</span>
                                    <h1 className='text-3xl text-white font-medium tracking-wide mb-4'>About TruePillar Realty</h1><div className="mt-5 inline-flex items-center gap-3 bg-luxury-card border border-neutral-800 rounded-lg px-4 py-3 text-sm"><span className="text-neutral-400">MAHARERA REGISTRATION NO.</span><strong className="text-luxury-gold">A031272401680</strong></div>
                                    <p className="text-sm md:text-base text-neutral-300">TruePillar Realty is a premium property consultancy firm specializing in handpicked luxury homes, under-construction residential marvels, and modern apartments across the Mumbai Metropolitan Region. Built upon the three core pillars of **Trust, Transparency, and Value**, we help modern families discover their dream spaces without navigating confusing, opaque market channels.</p>
                                </div>

                                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div className="bg-luxury-card border border-neutral-800 p-6 rounded-xl space-y-2">
                                        <div className="text-2xl text-luxury-gold font-bold">01</div>
                                        <h4 className="text-white font-semibold text-sm uppercase tracking-wide">Direct Developer Access</h4>
                                        <p className="text-xs text-neutral-400 font-light leading-relaxed">We source and index our inventories straight from trusted builders. This ensures early access to prime inventory, high-floor allocations, and accurate launch discount plans.</p>
                                    </div>
                                    <div className="bg-luxury-card border border-neutral-800 p-6 rounded-xl space-y-2">
                                        <div className="text-2xl text-luxury-gold font-bold">02</div>
                                        <h4 className="text-white font-semibold text-sm uppercase tracking-wide">Absolute Zero Brokerage</h4>
                                        <p className="text-xs text-neutral-400 font-light leading-relaxed">We stand strictly against traditional transactional markups and middleman premiums. Our consultation and matching guidance services are 100% free for home buyers.</p>
                                    </div>
                                    <div className="bg-luxury-card border border-neutral-800 p-6 rounded-xl space-y-2">
                                        <div className="text-2xl text-luxury-gold font-bold">03</div>
                                        <h4 className="text-white font-semibold text-sm uppercase tracking-wide">MahaRERA Compliance</h4>
                                        <p className="text-xs text-neutral-400 font-light leading-relaxed">Every residential space on our platform is cross-referenced with authorized state metrics, carpet measurements, and real-time possession timelines for absolute piece of mind.</p>
                                    </div>
                                </div>

                                <div className="bg-luxury-card border border-neutral-800 rounded-xl p-8 space-y-4">
                                    <h3 className="text-lg font-medium text-white tracking-wide">Our Mission Statement</h3>
                                    <p className="text-xs md:text-sm text-neutral-400 leading-relaxed font-light">"Our goal is simple: to make property buying standard, streamlined, and stress-free. Whether you are looking for an affordable 1 BHK startup layout in Dombivli, a spacious family 2 BHK on Thane's Ghodbunder high road, a modern 3 BHK lifestyle tower flat in Kharghar, or an elite penthouse overlooking Mumbai's iconic skyline—TruePillar Realty equips you with verified facts, real prices, and complimentary guided site vehicles to turn your real estate milestones into safe, rewarding realities."</p>
                                </div>
                            </div>
                        )}
                        {view === 'contact' && (
                            <div className='py-16 px-6 max-w-3xl mx-auto font-light text-neutral-300 space-y-6'>
                                <h1 className='text-3xl text-white font-medium mb-4 tracking-wide'>Get In Touch With Us</h1>
                                <p className="text-sm text-neutral-400">Have questions about an upcoming premium luxury project or want to plan a family visit to a site location? Reach out to us directly through any channel below.</p>
                                <div className="bg-luxury-card border border-neutral-800 rounded-xl p-6 space-y-4 font-medium text-sm">
                                    <div>📍 Main Office Location: <span className="text-neutral-400 font-light block mt-0.5">Kharghar, Navi Mumbai, Maharashtra</span></div>
                                    <div>📞 Central Support Helpline: <span className="text-luxury-gold block mt-0.5">+91 7718847841</span></div>
                                    <div>✉️ Business Email Address: <span className="text-luxury-gold font-mono block mt-0.5">sales@truepillar.in • salaj.jha@truepillar.in</span></div>
                                </div>
                            </div>
                        )}
                        {view === 'admin' && (
                            !isAuthenticated ? (
                                <SecureLoginGate onLoginSuccess={() => setIsAuthenticated(true)} />
                            ) : (
                                <AdminDashboard 
                                    listings={listings}
                                    leads={leads}
                                    onAdd={saveProject}
                                    onDelete={deleteProject}
                                    onEdit={saveProject}
                                    onDeleteLead={deleteLead}
                                    onUpdateLeadStatus={updateLeadStatus}
                                    onLogout={() => setIsAuthenticated(false)}
                                />
                            )
                        )}
                    </main>

                    <footer className="border-t border-neutral-900 bg-luxury-card py-12 px-6 lg:px-16 text-xs text-luxury-textMuted">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
                            <div className="space-y-3">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">TruePillar Realty</h4>
                                <p className="font-light leading-relaxed">Your premium home consultancy partner across Mumbai Metropolitan micro-markets. Verified developer properties with absolute Zero Brokerage execution frameworks.</p>
                            </div>
                            <div className="space-y-2 font-light">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">Quick Contacts</h4>
                                <div>📞 Phone Desk: +91 7718847841</div>
                                <div>✉️ Support: sales@truepillar.in</div>
                                <div>📍 Kharghar, Navi Mumbai</div>
                            </div>
                            <div className="space-y-2 font-light">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">Follow Our Pages</h4>
                                <div><a href="https://www.facebook.com/TruePillarRealty/" target="_blank" rel="noreferrer" className="hover:text-luxury-gold transition">➡️ Facebook Page</a></div>
                                <div><a href="https://www.instagram.com/truepillar.realty/" target="_blank" rel="noreferrer" className="hover:text-luxury-gold transition">➡️ Instagram Feed</a></div>
                            </div>
                            <div className="space-y-2">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">Regulatory & Compliance</h4>
                                <p className="font-light">© 2026 TruePillar Realty. All transactional support conforms with standard MAHA-RERA consumer protection metrics.</p>
                            </div>
                        </div>
                    </footer>

                    {activeEnquiryTarget && (
                        <EnquiryModal 
                            property={activeEnquiryTarget} 
                            onClose={() => setActiveEnquiryTarget(null)} 
                            onSubmitLead={saveLead}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
