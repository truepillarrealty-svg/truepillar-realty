.tp-v38-select-button{width:100%;min-height:44px;background:#07080a;border:1px solid #262a31;border-radius:6px;color:#fff;padding:0 38px 0 12px;text-align:left;font-size:12px;line-height:1.2;display:flex;align-items:center;justify-content:space-between;gap:10px;transition:border-color .18s ease,box-shadow .18s ease}
.tp-v38-select-button:hover,.tp-v38-select-button:focus{outline:none;border-color:#d4af37;box-shadow:0 0 0 2px rgba(212,175,55,.12)}
.tp-v38-select-button:after{content:"⌄";position:absolute;right:13px;color:#f0c94b;font-size:14px;pointer-events:none}
.tp-v38-select-menu{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:3000;max-height:220px;overflow:auto;background:#050507;border:1px solid #d4af37;border-radius:8px;box-shadow:0 18px 50px rgba(0,0,0,.7);padding:5px}
.tp-v38-select-option{width:100%;display:block;text-align:left;border:0;background:transparent;color:#f8fafc;padding:10px 12px;border-radius:6px;font-size:12px;cursor:pointer}
.tp-v38-select-option:hover,.tp-v38-select-option.tp-v38-active{background:#d4af37;color:#050505;font-weight:800}
.tp-v38-select-option:focus{outline:1px solid rgba(212,175,55,.8);outline-offset:1px}
</style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        function playableVideoUrl(url) {
            const u = String(url||"").trim();
            if (!u) return "";
            try {
                const x = new URL(u);
                if (x.hostname.includes("youtube.com") && x.pathname === "/watch") {
                    const id=x.searchParams.get("v"); return id ? "https://www.youtube.com/embed/"+id : u;
                }
                if (x.hostname.includes("youtu.be")) return "https://www.youtube.com/embed/"+x.pathname.replace(/^\//,"");
                if (x.hostname.includes("instagram.com")) return u.replace(/\/$/,"") + "/embed";
                return u;
            } catch(e) { return u; }
        }
        
        // --- FIREBASE CLOUD DATABASE + STORAGE ---
        const firebaseConfig = {
            apiKey: "AIzaSyAYGSK5KtmV-zK3ivYa3__4jI37sGm4NRA",
            authDomain: "truepillar-realty.firebaseapp.com",
            projectId: "truepillar-realty",
            storageBucket: "truepillar-realty.firebasestorage.app",
            messagingSenderId: "523826570330",
            appId: "1:523826570330:web:b036d66d0fd9a7dc1ae463"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        // Project media uploads use Cloudinary; Firestore remains the database.
        const auth = firebase.auth();
        const projectsCollection = db.collection("projects");
        const leadsCollection = db.collection("leads");
        const legacyCloudDoc = db.collection("appData").doc("truepillar");

        const cleanForFirestore = (value) => JSON.parse(JSON.stringify(value, (key, val) => val === undefined ? null : val));

        const CLOUDINARY_CLOUD_NAME = "he2l7oy3";
        const CLOUDINARY_UPLOAD_PRESET = "truepillar_upload";

        const uploadProjectFile = async (file, folder) => {
            const resourceType = file.type.startsWith("video/") ? "video" : "auto";
            const endpoint = `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`;
            const formData = new FormData();
            formData.append("file", file);
            formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

            const response = await fetch(endpoint, { method: "POST", body: formData });
            const result = await response.json();

            if (!response.ok || !result.secure_url) {
                throw new Error(result.error?.message || "Cloudinary upload failed");
            }
            return result.secure_url;
        };

        // --- CONSTANTS & GEOGRAPHICAL DATA MATRIX ---
        const REGIONS = {
            "Navi Mumbai": ["Kharghar", "Seawoods", "Nerul", "Vashi", "Sanpada", "Panvel", "Taloja", "Ulwe"],
            "Thane": ["Ghodbunder Road", "Majiwada", "Kapurbawdi", "Hiranandani Estate", "Kolshet Road", "Vartak Nagar"],
            "Mumbai": ["Andheri West", "Bandra West", "Worli", "Malad West", "Ghatkopar East", "Chembur", "Borivali West"],
            "Dombivli": ["Dombivli East", "Palava City", "Manpada", "Thakurli", "Kalyan Road"]
        };

        const CONFIGURATIONS = ["1 BHK", "2 BHK", "3 BHK", "4 BHK", "5 BHK / Penthouse"];
        const DEVELOPMENT_STATUS = ["Ready to Move", "Under Construction", "New Launch"];
        const COMPANY_MAHARERA = "A031272401680";
        const AMENITIES_POOL = ["Premium Clubhouse", "Infinity Swimming Pool", "Modern Gymnasium", "24/7 Multi-tier Security", "High-Speed Elevators", "Grand Entrance Lobby", "Ample Car Parking", "Landscaped Gardens", "Kids Play Area", "100% Power Backup"];

        function AdminSelect({ value, options, onChange, className = "", ariaLabel }) {
            const [open, setOpen] = React.useState(false);
            const rootRef = React.useRef(null);
            const normalizedOptions = options.map(option => typeof option === "string" ? { value: option, label: option } : option);
            React.useEffect(() => {
                if (!open) return;
                const handlePointer = (event) => {
                    if (rootRef.current && !rootRef.current.contains(event.target)) setOpen(false);
                };
                document.addEventListener("mousedown", handlePointer);
                return () => document.removeEventListener("mousedown", handlePointer);
            }, [open]);
            const selectedOption = normalizedOptions.find(option => option.value === value) || normalizedOptions[0] || { value: "", label: "" };
            return (
                <div ref={rootRef} className={`tp-v38-select ${className}`}>
                    <button type="button" className="tp-v38-select-button" aria-label={ariaLabel} aria-expanded={open} onClick={() => setOpen(x => !x)}>
                        <span>{selectedOption.label}</span>
                    </button>
                    {open && (
                        <div className="tp-v38-select-menu" role="listbox">
                            {normalizedOptions.map(option => (
                                <button
                                    type="button"
                                    key={option.value}
                                    role="option"
                                    aria-selected={option.value === selectedOption.value}
                                    className={`tp-v38-select-option ${option.value === selectedOption.value ? "tp-v38-active" : ""}`}
                                    onClick={() => { onChange(option.value); setOpen(false); }}
                                >
                                    {option.label}
                                </button>
                            ))}
                        </div>
                    )}
                </div>
            );
        }

        const TITLE_PREFIXES = ["The Grand", "Elysian", "Pinnacle", "Aura", "Regency", "Signature", "Golden", "Skyline", "Emerald", "Marquis", "Palazzo", "Imperial", "Sapphire", "Royal", "Oasis", "Vista", "Serene", "Meridian"];
        const TITLE_SUFFIXES = ["Residences", "Towers", "Estates", "Heights", "Manor", "Crest", "Villas", "Gardens", "Gre Greens", "Bay", "Terraces", "Enclave", "Palace", "Courtyard"];
        
        const STOCK_IMAGES = [
            "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=80"
        ];


        // --- PROJECT PAGE HELPERS ---
        const slugify = (text = "") => text.toLowerCase().trim().replace(/&/g, "and").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "");

        const IS_LOCAL_FILE = window.location.protocol === "file:";

        const getRouteFromPath = () => {
            if (IS_LOCAL_FILE) return { type: "view", view: "home" };
            const path = window.location.pathname.replace(/\/+$/, "") || "/";
            if (path === "/") return { type: "view", view: "home" };
            if (path === "/properties") return { type: "view", view: "properties" };
            if (path === "/about") return { type: "view", view: "about" };
            if (path === "/contact") return { type: "view", view: "contact" };
            if (path === "/admin") return { type: "view", view: "admin" };
            const slugMatch = path.match(/^\/([^/]+)$/);
            if (slugMatch) return { type: "project", slug: decodeURIComponent(slugMatch[1]) };
            return { type: "view", view: "home" };
        };

        const navigateToProjectUrl = (p) => {
            const url = `/${slugify(p.title)}`;
            if (window.location.pathname !== url) window.history.pushState({ project: p.id }, "", url);
        };
        const lines = (text = "") => text.split("\n").map(x => x.trim()).filter(Boolean);
        const pairs = (text = "") => lines(text).map(row => {
            const parts = row.split("|");
            return { label: (parts.shift() || "").trim(), value: parts.join("|").trim() };
        });
        const normalizeProject = (p) => ({
            ...p,
            slug: p.slug || slugify(p.title || ("project-" + p.id)),
            developer: p.developer || "Verified Developer",
            reraNumber: p.reraNumber || "",
            description: p.description || `Discover ${p.title}, a premium residential project in ${p.subLocality}, ${p.region}. Contact TruePillar Realty for verified pricing, layouts, availability and a complimentary site visit.`,
            images: (Array.isArray(p.images) ? p.images : [p.image]).filter(x => typeof x === "string" && (x.startsWith("data:image/") || x.startsWith("http") || x.startsWith("blob:"))),
            videos: Array.isArray(p.videos) ? p.videos : [],
            sampleVideoLinks: Array.isArray(p.sampleVideoLinks) ? p.sampleVideoLinks : [],
            highlightVideoLinks: Array.isArray(p.highlightVideoLinks) ? p.highlightVideoLinks : [],
            floorPlans: Array.isArray(p.floorPlans) ? p.floorPlans : [],
            mapLink: p.mapLink || "",
            nearbyPlaces: Array.isArray(p.nearbyPlaces) ? p.nearbyPlaces : [],
            statusBadge: p.statusBadge || "",
            pdfs: Array.isArray(p.pdfs) ? p.pdfs : [],
            highlights: Array.isArray(p.highlights) ? p.highlights : [],
            priceOptions: Array.isArray(p.priceOptions) ? p.priceOptions : [],
            configurations: (Array.isArray(p.configurations) && p.configurations.length ? p.configurations : [{ configuration: p.configuration || "", carpetArea: p.carpetArea || "", price: p.price || "" }]).map(c => ({
                ...c,
                sampleVideoLinks: Array.isArray(c.sampleVideoLinks) ? c.sampleVideoLinks : [],
                highlightVideoLinks: Array.isArray(c.highlightVideoLinks) ? c.highlightVideoLinks : [],
                floorPlans: Array.isArray(c.floorPlans) ? c.floorPlans : []
            })),
            specifications: Array.isArray(p.specifications) ? p.specifications : [],
            locationAdvantages: Array.isArray(p.locationAdvantages) ? p.locationAdvantages : [],
            faqs: Array.isArray(p.faqs) ? p.faqs : [],
            published: p.published !== false
        });
        const projectLink = p => `${location.origin}/${p.slug || slugify(p.title)}`;
        const projectConfigurations = p => (Array.isArray(p.configurations) && p.configurations.length ? p.configurations : [{configuration:p.configuration||"",carpetArea:p.carpetArea||"",price:p.price||""}]).filter(x=>x&&(x.configuration||x.carpetArea||x.price));
        const projectMatchesConfiguration = (p,c) => !c || projectConfigurations(p).some(x=>String(x.configuration||"").toLowerCase()===String(c).toLowerCase());
        const projectConfigSummary = p => [...new Set(projectConfigurations(p).map(x=>x.configuration).filter(Boolean))].join(", ") || p.configuration || "";
        const projectStartingPrice = p => projectConfigurations(p)[0]?.price || p.price || "";
        const projectAreaSummary = p => { const a=projectConfigurations(p).map(x=>x.carpetArea).filter(Boolean); return a.length>1 ? `${a[0]} onwards` : (a[0]||p.carpetArea||""); };
        const projectCardSampleVideo = (p, selectedConfig="") => {
            const configs=projectConfigurations(p);
            const matched=selectedConfig ? configs.find(c=>String(c.configuration||"").toLowerCase()===String(selectedConfig).toLowerCase()) : null;
            if(matched?.sampleVideoLinks?.length) return matched.sampleVideoLinks[0];
            const anyConfig=configs.find(c=>c?.sampleVideoLinks?.length);
            return anyConfig?.sampleVideoLinks?.[0] || p.sampleVideoLinks?.[0] || "";
        };
        const getActiveConfiguration = (p, selectedConfig) => projectConfigurations(p).find(x=>String(x.configuration||"").toLowerCase()===String(selectedConfig||"").toLowerCase()) || projectConfigurations(p)[0] || {};

        // --- AUTOMATED PROPERTIES POPULATER ---
        const compileInitialListings = () => {
            const listings = [];
            const regionKeys = Object.keys(REGIONS);
            
            for (let i = 1; i <= 85; i++) {
                const region = regionKeys[(i - 1) % regionKeys.length];
                const subLocalities = REGIONS[region];
                const subLocality = subLocalities[(i - 1) % subLocalities.length];
                const config = CONFIGURATIONS[(i - 1) % CONFIGURATIONS.length];
                const status = DEVELOPMENT_STATUS[i % DEVELOPMENT_STATUS.length];
                const prefix = TITLE_PREFIXES[(i * 3) % TITLE_PREFIXES.length];
                const suffix = TITLE_SUFFIXES[(i * 7) % TITLE_SUFFIXES.length];
                const img = STOCK_IMAGES[i % STOCK_IMAGES.length];
                
                let carpetArea = 450 + ((i * 15) % 1800);
                let possession = status === "Ready to Move" ? "Ready" : `Dec 20${26 + (i % 4)}`;
                
                let basePrice = config.includes("1 BHK") ? 55 : (config.includes("2 BHK") ? 95 : (config.includes("3 BHK") ? 160 : 280));
                let regionalMultiplier = region === "Mumbai" ? 2.3 : (region === "Thane" ? 1.25 : (region === "Navi Mumbai" ? 1.0 : 0.7));
                let calculatedPrice = Math.round(basePrice * regionalMultiplier);
                let formattedPrice = calculatedPrice >= 100 ? `₹${(calculatedPrice / 100).toFixed(2)} Cr` : `₹${calculatedPrice} Lakhs`;

                listings.push({
                    id: i,
                    title: `${prefix} ${suffix}`,
                    region: region,
                    subLocality: subLocality,
                    configuration: config,
                    status: status,
                    price: formattedPrice,
                    image: img,
                    carpetArea: `${carpetArea} Sq. Ft.`,
                    possession: possession,
                    address: `Sector ${((i * 3) % 20) + 1}, Near High Street, ${subLocality}, ${region}`,
                    amenities: [AMENITIES_POOL[i % AMENITIES_POOL.length], AMENITIES_POOL[(i + 3) % AMENITIES_POOL.length], AMENITIES_POOL[(i + 6) % AMENITIES_POOL.length]]
                });
            }
            return listings;
        };

        // --- SEARCH & FILTER COMPONENT ---
        function SearchFilterBar({ listings = [], search, setSearch, selectedRegion, setSelectedRegion, selectedSubLocality, setSelectedSubLocality, selectedConfig, setSelectedConfig, selectedStatus, setSelectedStatus }) {
            const [suggestionsOpen, setSuggestionsOpen] = React.useState(false);
            const closeSuggestions = () => setSuggestionsOpen(false);
            return (
                <div className="tp-v23-housing-filter bg-luxury-card border border-neutral-800 p-3 rounded-xl space-y-3 lg:space-y-0 lg:flex lg:gap-0 items-center shadow-xl w-full">
                    <div className="flex-1 min-w-[200px] relative z-[100]" onFocus={()=>setSuggestionsOpen(true)}>
                        <input type="text" placeholder="Search project, location, city, developer..." className="w-full bg-luxury-bg border border-neutral-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-luxury-gold text-white" value={search} onChange={(e)=>{setSearch(e.target.value);setSuggestionsOpen(true)}} />
                        {search.trim() && suggestionsOpen && <div className="absolute left-0 right-0 top-full mt-2 bg-[#111114] border border-neutral-700 rounded-lg shadow-2xl max-h-80 overflow-y-auto">{(()=>{
                            const q=search.toLowerCase(), seen=new Set(), items=[];
                            const add=(type,label,detail)=>{if(label&&label.toLowerCase().includes(q)){const k=(type+label).toLowerCase();if(!seen.has(k)){seen.add(k);items.push({type,label,detail})}}};
                            listings.filter(p=>p.published!==false).forEach(p=>{add("Project",p.title,`${p.subLocality}, ${p.region}`);add("Location",p.subLocality,p.region);add("City",p.region,"All matching projects");add("Developer",p.developer,p.title);add("Address",p.address,p.title)});
                            return items.slice(0,12).length ? items.slice(0,12).map((s,i)=><button type="button" key={i} onClick={()=>{setSearch(s.label);setSuggestionsOpen(false)}} className="w-full text-left px-4 py-3 border-b border-neutral-800 last:border-0 hover:bg-neutral-900 flex gap-3"><span className="text-[9px] uppercase text-luxury-gold border border-luxury-gold/40 rounded px-1.5 py-0.5 h-fit min-w-[58px] text-center">{s.type}</span><span><strong className="block text-sm text-white">{s.label}</strong><small className="text-neutral-500">{s.detail}</small></span></button>) : <div className="px-4 py-4 text-sm text-neutral-500">No matching project or location found.</div>;
                        })()}</div>}
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 lg:flex lg:gap-3">
                        <AdminSelect
                            className="lg:w-44"
                            ariaLabel="City / Region filter"
                            value={selectedRegion}
                            options={[{ value: "", label: "All Cities / Regions" }, ...Object.keys(REGIONS).map(r => ({ value: r, label: r }))]}
                            onChange={(region) => { closeSuggestions(); setSelectedRegion(region); setSelectedSubLocality(""); }}
                        />

                        <AdminSelect
                            className="lg:w-48"
                            ariaLabel="Locality filter"
                            value={selectedSubLocality}
                            options={[{ value: "", label: "All Localities" }, ...(selectedRegion ? REGIONS[selectedRegion].map(sub => ({ value: sub, label: sub })) : [])]}
                            onChange={(subLocality) => { closeSuggestions(); setSelectedSubLocality(subLocality); }}
                        />

                        <AdminSelect
                            className="lg:w-40"
                            ariaLabel="BHK Configuration filter"
                            value={selectedConfig}
                            options={[{ value: "", label: "BHK Configuration" }, ...CONFIGURATIONS.map(c => ({ value: c, label: c }))]}
                            onChange={(configuration) => { closeSuggestions(); setSelectedConfig(configuration); }}
                        />

                        <AdminSelect
                            className="lg:w-44"
                            ariaLabel="Possession Status filter"
                            value={selectedStatus}
                            options={[{ value: "", label: "Possession Status" }, ...DEVELOPMENT_STATUS.map(status => ({ value: status, label: status }))]}
                            onChange={(status) => { closeSuggestions(); setSelectedStatus(status); }}
                        />
                    </div>
                </div>
            );
        }

        // --- ENQUIRY MODAL / SITE VISIT POPUP ---
        function EnquiryModal({ property, onClose, onSubmitLead, formTitle = "Book a Free Site Visit" }) {
            const [name, setName] = React.useState("");
            const [phone, setPhone] = React.useState("");
            const [email, setEmail] = React.useState("");
            const [date, setDate] = React.useState("");
            const [notes, setNotes] = React.useState("");
            const [visitTime, setVisitTime] = React.useState("");
            const [pickup, setPickup] = React.useState("");
            const [visitors, setVisitors] = React.useState("1");

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const newLead = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString(),
                    clientName: name,
                    clientPhone: phone,
                    clientEmail: email,
                    assetTitle: property ? property.title : "General Home Page Request",
                    assetLocation: property ? `${property.subLocality}, ${property.region}` : "Multiple Locations Interest",
                    clientNotes: `Preferred Visit Date: ${date || 'Not specified'}. Preferred Time: ${visitTime || 'Not specified'}. Pickup Required: ${pickup || 'Not specified'}. Visitors: ${visitors}. ${notes}`,
                    status: "New Lead"
                };
                onSubmitLead(newLead);
                
                const customMessage = `Hello TruePillar Realty, my name is ${name}. I want to book a free site visit ${property ? `for the project: "${property.title}" in ${property.subLocality}` : 'to look at premium properties'}. ${date ? `Preferred Date: ${date}` : ''}. Please call me back with layout plans.`;
                window.open(`https://wa.me/917718847841?text=${encodeURIComponent(customMessage)}`, '_blank');
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-start sm:items-center justify-center p-2 sm:p-4 overflow-y-auto">
                    <div className="bg-luxury-card border border-neutral-800 rounded-2xl w-full max-w-lg p-4 sm:p-5 relative my-2 sm:my-4 max-h-[96vh] overflow-y-auto">
                        <button onClick={onClose} className="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">&times;</button>
                        <span className="text-[10px] uppercase font-bold tracking-widest text-luxury-gold">Verified Buyer Service</span>
                        <h3 className="text-xl font-medium mt-1 mb-4 text-white">{formTitle}</h3>
                        
                        {property && (
                            <div className="grid grid-cols-2 gap-2 bg-luxury-bg p-3 rounded-lg text-xs text-neutral-400 mb-4 border border-neutral-900">
                                <div>📍 Location: <span className="text-white">{property.subLocality}</span></div>
                                <div>📐 Area: <span className="text-white">{property.carpetArea}</span></div>
                                <div>🔑 Status: <span className="text-white">{property.status}</span></div>
                                <div>💰 Price: <span className="text-white font-semibold text-luxury-gold">{projectStartingPrice(property)}</span></div>
                            </div>
                        )}

                        <form onSubmit={handleFormSubmit} className="space-y-4 text-sm text-neutral-200">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Your Full Name *</label>
                                    <input type="text" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-white" value={name} onChange={e => setName(e.target.value)} required />
                                </div>
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Phone / WhatsApp Number *</label>
                                    <input type="tel" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-white" value={phone} onChange={e => setPhone(e.target.value)} required />
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Email Address (Optional)</label>
                                    <input type="email" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-white" value={email} onChange={e => setEmail(e.target.value)} />
                                </div>
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Preferred Visit Date</label>
                                    <input type="date" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-neutral-400" value={date} onChange={e => setDate(e.target.value)} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs text-neutral-400 mb-1">Any Specific Requirements? (Optional)</label>
                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-3">
                                <select value={visitTime} onChange={e=>setVisitTime(e.target.value)} className="bg-luxury-bg border border-neutral-800 rounded p-2.5 text-white"><option value="">Visit Time</option><option>Morning</option><option>Afternoon</option><option>Evening</option></select>
                                <select value={pickup} onChange={e=>setPickup(e.target.value)} className="bg-luxury-bg border border-neutral-800 rounded p-2.5 text-white"><option value="">Pickup?</option><option>Yes</option><option>No</option></select>
                                <input type="number" min="1" value={visitors} onChange={e=>setVisitors(e.target.value)} placeholder="Visitors" className="bg-luxury-bg border border-neutral-800 rounded p-2.5 text-white"/>

                            </div>
                            
<button type="submit" className="w-full bg-luxury-gold hover:bg-luxury-goldHover text-black py-3 rounded font-bold uppercase tracking-wider transition text-xs shadow-lg">Confirm & Book Free Site Visit</button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- PROPERTY CARD VIEW ---
        function MediaWatermark({ compact=false }) {
            return <div className="pointer-events-none absolute inset-0 overflow-hidden z-20"><div className={`absolute inset-[-35%] flex flex-wrap items-center justify-center gap-x-16 gap-y-10 rotate-[-24deg] ${compact?'text-[8px]':'text-xs md:text-sm'} font-semibold tracking-widest text-white/[0.14]`}>{Array.from({length:compact?10:20}).map((_,i)=><span key={i} className="whitespace-nowrap">TRUEPILLAR REALTY • +91 77188 47841</span>)}</div></div>;
        }

        function ProjectEmiCalculator({ price }) {
            const priceNumber=(()=>{const n=parseFloat(String(price||"").replace(/[^0-9.]/g,""))||100;const s=String(price||"").toLowerCase();return s.includes("cr")?n*10000000:s.includes("l")?n*100000:n;})();
            const [loan,setLoan]=React.useState(Math.round(priceNumber*0.8));
            const [rate,setRate]=React.useState(8.5);
            const [years,setYears]=React.useState(20);
            const monthly=rate/1200, months=years*12;
            const emi=Math.round(monthly?loan*monthly*Math.pow(1+monthly,months)/(Math.pow(1+monthly,months)-1):loan/months);
            return <div className="bg-luxury-card border border-neutral-800 rounded-xl p-6"><h2 className="text-xl font-semibold mb-5">EMI Calculator</h2><div className="grid md:grid-cols-3 gap-3 text-sm"><label>Loan Amount<input type="number" value={loan} onChange={e=>setLoan(+e.target.value)} className="mt-2 w-full bg-luxury-bg border border-neutral-800 rounded p-3"/></label><label>Interest %<input type="number" step="0.1" value={rate} onChange={e=>setRate(+e.target.value)} className="mt-2 w-full bg-luxury-bg border border-neutral-800 rounded p-3"/></label><label>Tenure (Years)<input type="number" value={years} onChange={e=>setYears(+e.target.value)} className="mt-2 w-full bg-luxury-bg border border-neutral-800 rounded p-3"/></label></div><div className="mt-5 bg-luxury-bg rounded-lg p-4"><span className="text-xs text-neutral-500">Estimated Monthly EMI</span><div className="text-2xl text-luxury-gold font-bold mt-1">₹{Number.isFinite(emi)?emi.toLocaleString("en-IN"):"—"}</div></div></div>;
        }

        function PropertyCard({ property, onOpenEnquiry, onOpenProject, selectedConfig="" }) {
            const cardProject=normalizeProject(property);
            const cardConfigurations = projectConfigurations(cardProject);
            // Card video must come only from the current configuration media saved in Admin.
            // Do not fall back to legacy project-level links, because removed old videos can otherwise reappear.
            const cardSampleVideo = (
                (cardConfigurations.find(c => Array.isArray(c.sampleVideoLinks) && c.sampleVideoLinks.filter(link => String(link || "").trim()).length)?.sampleVideoLinks || [])
                    .find(link => String(link || "").trim())
                || ""
            );
            const cardAmenities = Array.isArray(property.amenities)
                ? property.amenities.filter(am => String(am || "").trim())
                : [];
            const visibleCardAmenities = cardAmenities.slice(0, 4);
            const hiddenAmenityCount = Math.max(0, cardAmenities.length - visibleCardAmenities.length);
            const initialCardConfig = selectedConfig && projectMatchesConfiguration(cardProject, selectedConfig)
                ? getActiveConfiguration(cardProject, selectedConfig).configuration
                : (cardConfigurations[0]?.configuration || "");
            const [cardSelectedConfig, setCardSelectedConfig] = React.useState(initialCardConfig);
            const activeConfig=getActiveConfiguration(cardProject, cardSelectedConfig);
            const activeConfigLabel = activeConfig.configuration || projectConfigSummary(cardProject);
            const activeArea = activeConfig.carpetArea || projectAreaSummary(cardProject);
            const activePrice = activeConfig.price || projectStartingPrice(cardProject);
            const [cardImage,setCardImage]=React.useState(0);
            React.useEffect(()=>{ if(cardProject.images.length<2)return; const timer=setInterval(()=>setCardImage(i=>(i+1)%cardProject.images.length),2800); return()=>clearInterval(timer); },[cardProject.id,cardProject.images.length]);
            React.useEffect(()=>{ setCardSelectedConfig(initialCardConfig); }, [cardProject.id, initialCardConfig]);
            return (
                <div className="bg-luxury-card rounded-xl overflow-hidden border border-neutral-800 hover:border-luxury-gold/40 transition-all duration-300 group flex flex-col justify-between shadow-xl">
                    <div className="relative overflow-hidden h-64 bg-neutral-900">
                        <img src={cardProject.images[cardImage] || property.image} alt={property.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />

                            {cardProject.statusBadge && <span className="absolute top-3 left-3 z-30 bg-black/85 border border-luxury-gold text-luxury-gold text-[9px] font-bold uppercase px-2 py-1 rounded">{cardProject.statusBadge}</span>}
                            {cardProject.images.length>1 && <div className="absolute bottom-3 left-1/2 -translate-x-1/2 z-30 flex gap-1.5">{cardProject.images.slice(0,8).map((_,i)=><span key={i} className={`w-1.5 h-1.5 rounded-full ${i===cardImage?'bg-luxury-gold':'bg-white/60'}`}></span>)}</div>}
                        <span className={`absolute ${cardProject.statusBadge ? "top-12" : "top-4"} left-4 z-20 px-3 py-1 text-[10px] tracking-widest uppercase rounded-full font-bold bg-black/80 text-luxury-gold border border-luxury-gold/30`}>{property.status}</span>
                        <span className="absolute bottom-3 right-3 px-2 py-0.5 text-[10px] rounded bg-neutral-900/90 text-white font-medium">📐 {activeArea}</span>
                    </div>
                    <div className="p-7 flex-grow flex flex-col justify-between">
                        <div>
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-[11px] text-luxury-gold font-bold uppercase tracking-widest">{activeConfigLabel}</span>
                                <span className="text-xs text-neutral-400 font-medium">📍 {property.subLocality}</span>
                            </div>
                            <button onClick={() => onOpenProject(property, cardSelectedConfig)} className="text-left w-full"><h3 className="text-xl font-bold text-white group-hover:text-luxury-gold transition mb-3">{property.title}</h3></button>
                            <p className="text-xs text-luxury-textMuted font-light line-clamp-2 mb-3">{property.address}</p>
                            <div className="text-xs text-neutral-400 font-light mb-4 flex items-center gap-1">🔑 Possession: <span className="text-white font-medium">{property.possession}</span></div>
                            {cardConfigurations.length > 1 && (
                                <div className="mb-4 rounded-lg border border-neutral-900 bg-luxury-bg/70 p-2">
                                    <div className="text-[9px] uppercase tracking-widest text-neutral-500 mb-2">Choose Configuration</div>
                                    <div className="grid grid-cols-2 gap-1.5">
                                        {cardConfigurations.map((config, index) => (
                                            <button
                                                type="button"
                                                key={`${config.configuration}-${index}`}
                                                onClick={(event) => { event.stopPropagation(); setCardSelectedConfig(config.configuration); }}
                                                className={`text-left rounded border px-2 py-1.5 transition ${activeConfig.configuration === config.configuration ? "bg-luxury-gold text-black border-luxury-gold" : "border-neutral-800 text-white hover:border-luxury-gold"}`}
                                            >
                                                <b className="block text-[10px]">{config.configuration || "Configuration"}</b>
                                                <span className={`block text-[9px] ${activeConfig.configuration === config.configuration ? "text-black/70" : "text-neutral-400"}`}>{config.carpetArea || "Area on request"}</span>
                                                <span className={`block text-[10px] font-bold ${activeConfig.configuration === config.configuration ? "text-black" : "text-luxury-gold"}`}>{config.price || "Price on request"}</span>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}
                            
                            {cardAmenities.length > 0 && <div className="flex flex-wrap gap-1.5 mb-4">
                                {visibleCardAmenities.map((am, index) => (
                                    <span key={index} className="text-[10px] bg-luxury-bg border border-neutral-900 text-neutral-400 px-2 py-0.5 rounded-md">{am}</span>
                                ))}
                                {hiddenAmenityCount > 0 && (
                                    <button type="button" onClick={() => onOpenProject(property, cardSelectedConfig)} className="text-[10px] bg-luxury-gold/10 border border-luxury-gold/40 text-luxury-gold px-2 py-0.5 rounded-md font-bold hover:bg-luxury-gold hover:text-black transition">
                                        +{hiddenAmenityCount} more
                                    </button>
                                )}
                            </div>}
                        </div>
                        <div className="pt-4 border-t border-neutral-900 flex justify-between items-center mt-auto">
                            <div><span className="text-2xl font-bold text-white tracking-tight">{activePrice}</span><span className="block text-[10px] text-neutral-500">{activeConfigLabel} • {activeArea}</span></div>
                            <div className="grid grid-cols-2 gap-2 w-[238px]">
                                <button onClick={() => onOpenProject(property, cardSelectedConfig)} className="border border-luxury-gold text-luxury-gold text-[10px] font-bold px-2 py-2.5 rounded uppercase whitespace-nowrap">View Details</button>
                                <button onClick={() => onOpenEnquiry(property)} className="bg-luxury-gold hover:bg-luxury-goldHover text-black text-[10px] font-bold px-2 py-2.5 rounded uppercase whitespace-nowrap">Site Visit</button>
                                {cardSampleVideo && <a href={cardSampleVideo} target="_blank" rel="noopener noreferrer" onClick={e=>e.stopPropagation()} className="col-span-2 flex items-center justify-center border border-red-700 text-red-400 text-[10px] font-bold px-3 py-2 rounded uppercase whitespace-nowrap">▶ Watch Sample Flat Video</a>}
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        // --- NAVIGATION BAR ---
        function Navbar({ currentView, setView }) {
            const navLabels = {

            return (
                <nav className="sticky top-0 z-40 border-b border-neutral-900 bg-luxury-bg/95 backdrop-blur px-6 lg:px-16 py-4 flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div className="cursor-pointer text-center md:text-left" onClick={() => setView('home')}>
                        <span className="text-xl font-bold tracking-widest text-white">TRUEPILLAR <span className="text-luxury-gold">REALTY</span></span>
                        <div className="text-[10px] tracking-widest text-luxury-textMuted uppercase block font-semibold">Trust • Transparency • Zero Brokerage</div>

                    <div className="flex flex-wrap justify-center gap-7 text-sm tracking-wider uppercase font-bold">

                            </button>

                    <div className="flex gap-3 items-center">
                        <a href="https://www.facebook.com/TruePillarRealty/" target="_blank" rel="noreferrer" className="text-neutral-400 hover:text-luxury-gold text-sm transition">
                            Facebook
                        </a>
                        <span className="text-neutral-800">|</span>
                        <a href="https://www.instagram.com/truepillar.realty/" target="_blank" rel="noreferrer" className="text-neutral-400 hover:text-luxury-gold text-sm transition">
                            Instagram
                        </a><a href="tel:+917718847841" style={{color:"#e2bb32",textDecoration:"none",fontWeight:800,marginLeft:16,whiteSpace:"nowrap"}}>☎ +91 7718847841</a>
                    </div>

        // --- HOME SCREEN VIEW ---
        function Home({ setView, listings, onOpenEnquiry, onOpenProject, filterState, onSubmitHomeLead }) {

            const handleHomeForm = (e) => {
                e.preventDefault();
                const newLead = {

                    timestamp: new Date().toLocaleString(),
                    clientName: hName,

                    clientEmail: "N/A (Home Form)",

                    assetLocation: hLoc,
                    clientNotes: `Preferred Project: ${hProject || "Not specified"}. Preferred Date: ${hDate || "Not specified"}. Preferred Time: ${hTime || "Not specified"}. Visitors: ${hVisitors}. Message: ${hMessage || "None"}.`,
                    status: "New Lead"
                };
                onSubmitHomeLead(newLead);
                
                const customMsg = `Hello TruePillar Realty, my name is ${hName}. I would like to schedule a free site visit in ${hLoc}${hProject ? ` for ${hProject}` : ""}. Preferred date: ${hDate || "Flexible"}. Preferred time: ${hTime || "Flexible"}. Visitors: ${hVisitors}. ${hMessage}`;
                window.open(`https://wa.me/917718847841?text=${encodeURIComponent(customMsg)}`, '_blank');
                
                setHName("");
                setHPhone("");
                alert("Site Visit Request Logged! We are launching your chat connection now.");
            };

            return (
                <div className="space-y-8">
                    
                    {/* Hero Split Section */}
                    <section className="tp-v24-hero max-w-7xl mx-auto px-6 lg:px-10 py-4 rounded-2xl">
                        <div className="lg:col-span-5 space-y-4 text-center lg:text-left">
                            <div className="tp-v27-hero-title-row">
                                <h1 className="text-4xl md:text-6xl font-light tracking-tight leading-tight text-white">Find Your Dream Home with <span className="text-luxury-gold font-bold">Zero Brokerage</span></h1>
                                <button onClick={() => setView('properties')} className="tp-v27-browse-button">Browse Properties</button>
                            </div>
                            <p className="text-luxury-textMuted max-w-xl mx-auto lg:mx-0 text-sm md:text-base font-light">Explore handpicked residential landmarks across Mumbai, Thane, Navi Mumbai, and Dombivli. Buy directly from top developers with absolute trust, clarity, and zero brokerage fees.</p>
                        </div>
                    </section>

                    <section className="tp-v25-search-zone tp-v27-search-zone max-w-7xl mx-auto px-6">
                      <div className="tp-v25-search-title"><span>⌕</span> Search homes by location, project or budget</div>
                      <SearchFilterBar {...filterState} listings={listings} />
                    </section>
                    <TopSpotlight listings={listings} onOpenProject={onOpenProject} onOpenEnquiry={onOpenEnquiry} />
                    <section className="py-6 px-6 lg:px-16 max-w-7xl mx-auto">
                        <div className="flex items-end justify-between gap-4 mb-5 flex-wrap">

                            </div>
                            <button onClick={() => setView('properties')} className="text-xs uppercase tracking-[0.2em] text-luxury-gold font-bold">View All</button>
                        </div>
                        <div className="tp-v20-property-grid grid gap-5">
                            {listings.slice(0, 8).map(property => (
                                <PropertyCard
                                    key={property.id}
                                    property={property}
                                    onOpenEnquiry={onOpenEnquiry}
                                    onOpenProject={onOpenProject}

                    </section>
                    <section className="py-8 px-6 lg:px-16 max-w-7xl mx-auto grid lg:grid-cols-3 gap-5">
                        <div className="bg-luxury-card border border-neutral-800 rounded-2xl p-6">
                            <div className="text-luxury-gold text-[10px] uppercase tracking-[0.35em] font-bold mb-3">Why TruePillar</div>
                            <h3 className="text-2xl mb-3">Trusted buying, simpler process</h3>
                            <p className="text-sm text-luxury-textMuted leading-6">Verified projects, honest pricing, zero brokerage, and site visit support designed for faster decisions.</p>
                        </div>
                        <div className="bg-luxury-card border border-neutral-800 rounded-2xl p-6">
                            <div className="text-luxury-gold text-[10px] uppercase tracking-[0.35em] font-bold mb-3">Top Localities</div>
                            <h3 className="text-2xl mb-3">Kharghar, Thane, Dombivli</h3>
                            <p className="text-sm text-luxury-textMuted leading-6">Focused inventory in the highest-demand growth corridors across the Mumbai region.</p>
                        </div>
                        <div className="bg-luxury-card border border-neutral-800 rounded-2xl p-6">
                            <div className="text-luxury-gold text-[10px] uppercase tracking-[0.35em] font-bold mb-3">Trust Signals</div>
                            <h3 className="text-2xl mb-3">MahaRERA verified</h3>
                            <p className="text-sm text-luxury-textMuted leading-6">Direct project support with documented broker-free assistance and a premium buying experience.</p>

                    <section className="py-4 px-6 lg:px-16 max-w-7xl mx-auto">
                        <div className="bg-luxury-card border border-neutral-800 rounded-2xl p-6 md:p-8">
                            <div className="grid md:grid-cols-4 gap-5 text-center">
                                <div><div className="text-3xl font-bold text-luxury-gold">85+</div><div className="text-xs uppercase tracking-[0.2em] text-neutral-400 mt-2">Projects</div></div>
                                <div><div className="text-3xl font-bold text-luxury-gold">4</div><div className="text-xs uppercase tracking-[0.2em] text-neutral-400 mt-2">Cities</div></div>
                                <div><div className="text-3xl font-bold text-luxury-gold">0%</div><div className="text-xs uppercase tracking-[0.2em] text-neutral-400 mt-2">Brokerage</div></div>

        // --- MAIN APP ---
        function App() {
            const [listings, setListings] = React.useState([]);
            const [view, setView] = React.useState('home');
            const [search, setSearch] = React.useState('');
            const [selectedRegion, setSelectedRegion] = React.useState('');
            const [selectedSubLocality, setSelectedSubLocality] = React.useState('');
            const [selectedConfig, setSelectedConfig] = React.useState('');
            const [selectedStatus, setSelectedStatus] = React.useState('');
            const [selectedProject, setSelectedProject] = React.useState(null);
            const [enquiryProject, setEnquiryProject] = React.useState(null);

            React.useEffect(() => { setListings(compileInitialListings()); }, []);

            const filterState = {
                search, setSearch,
                selectedRegion, setSelectedRegion,
                selectedSubLocality, setSelectedSubLocality,
                selectedConfig, setSelectedConfig,
                selectedStatus, setSelectedStatus
            };

            const onOpenProject = (project, config = '') => {
                setSelectedProject({ ...project, selectedConfig: config });

            const onOpenEnquiry = (project) => setEnquiryProject(project);
            const onSubmitHomeLead = (lead) => { console.log(lead); };

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
