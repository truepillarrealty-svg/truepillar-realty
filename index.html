<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>TruePillar Realty | Premium Homes in Navi Mumbai, Thane & Mumbai | Zero Brokerage</title>
    <meta name="description" content="Find your dream property with TruePillar Realty. Browse verified luxury 1, 2, 3 & 4 BHK apartments across Navi Mumbai, Thane, Mumbai, and Dombivli with absolute Zero Brokerage charges. Book a free site visit today.">
    <meta name="keywords" content="TruePillar Realty, buy flat in navi mumbai, flats in thane, properties in mumbai, dombivli real estate, zero brokerage real estate, premium apartments mumbai, book site visit flat">
    <meta name="robots" content="index, follow">
    
    <meta property="og:type" content="website">
    <meta property="og:title" content="TruePillar Realty | Direct Developer Properties & Zero Brokerage">
    <meta property="og:description" content="Browse verified luxury listings across top localities. Connect directly with builders with zero brokerage fees.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80">

    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        luxury: {
                            bg: '#0A0A0C',
                            card: '#121216',
                            gold: '#D4AF37',
                            goldHover: '#AA8419',
                            textMuted: '#94A3B8'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0A0A0C; color: white; font-family: system-ui, -apple-system, sans-serif; overflow-x: hidden; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0A0A0C; }
        ::-webkit-scrollbar-thumb { background: #262626; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #D4AF37; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // --- CONSTANTS & GEOGRAPHICAL DATA MATRIX ---
        const REGIONS = {
            "Navi Mumbai": ["Kharghar", "Seawoods", "Nerul", "Vashi", "Sanpada", "Panvel", "Taloja", "Ulwe"],
            "Thane": ["Ghodbunder Road", "Majiwada", "Kapurbawdi", "Hiranandani Estate", "Kolshet Road", "Vartak Nagar"],
            "Mumbai": ["Andheri West", "Bandra West", "Worli", "Malad West", "Ghatkopar East", "Chembur", "Borivali West"],
            "Dombivli": ["Dombivli East", "Palava City", "Manpada", "Thakurli", "Kalyan Road"]
        };

        const CONFIGURATIONS = ["1 BHK", "2 BHK", "3 BHK", "4 BHK", "5 BHK / Penthouse"];
        const DEVELOPMENT_STATUS = ["Ready to Move", "Under Construction", "New Launch"];
        const AMENITIES_POOL = ["Premium Clubhouse", "Infinity Swimming Pool", "Modern Gymnasium", "24/7 Multi-tier Security", "High-Speed Elevators", "Grand Entrance Lobby", "Ample Car Parking", "Landscaped Gardens", "Kids Play Area", "100% Power Backup"];

        const TITLE_PREFIXES = ["The Grand", "Elysian", "Pinnacle", "Aura", "Regency", "Signature", "Golden", "Skyline", "Emerald", "Marquis", "Palazzo", "Imperial", "Sapphire", "Royal", "Oasis", "Vista", "Serene", "Meridian"];
        const TITLE_SUFFIXES = ["Residences", "Towers", "Estates", "Heights", "Manor", "Crest", "Villas", "Gardens", "Gre Greens", "Bay", "Terraces", "Enclave", "Palace", "Courtyard"];
        
        const STOCK_IMAGES = [
            "https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600607687939-ce8a6c25118c?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600566753376-12c8ab7fb75b?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1600585154526-990dced4db0d?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1512917774080-9991f1c4c750?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1613490493576-7fde63acd811?auto=format&fit=crop&w=800&q=80",
            "https://images.unsplash.com/photo-1580587771525-78b9dba3b914?auto=format&fit=crop&w=800&q=80"
        ];

        // --- AUTOMATED PROPERTIES POPULATER ---
        const compileInitialListings = () => {
            const listings = [];
            const regionKeys = Object.keys(REGIONS);
            
            for (let i = 1; i <= 85; i++) {
                const region = regionKeys[(i - 1) % regionKeys.length];
                const subLocalities = REGIONS[region];
                const subLocality = subLocalities[(i - 1) % subLocalities.length];
                const config = CONFIGURATIONS[(i - 1) % CONFIGURATIONS.length];
                const status = DEVELOPMENT_STATUS[i % DEVELOPMENT_STATUS.length];
                const prefix = TITLE_PREFIXES[(i * 3) % TITLE_PREFIXES.length];
                const suffix = TITLE_SUFFIXES[(i * 7) % TITLE_SUFFIXES.length];
                const img = STOCK_IMAGES[i % STOCK_IMAGES.length];
                
                let carpetArea = 450 + ((i * 15) % 1800);
                let possession = status === "Ready to Move" ? "Ready" : `Dec 20${26 + (i % 4)}`;
                
                let basePrice = config.includes("1 BHK") ? 55 : (config.includes("2 BHK") ? 95 : (config.includes("3 BHK") ? 160 : 280));
                let regionalMultiplier = region === "Mumbai" ? 2.3 : (region === "Thane" ? 1.25 : (region === "Navi Mumbai" ? 1.0 : 0.7));
                let calculatedPrice = Math.round(basePrice * regionalMultiplier);
                let formattedPrice = calculatedPrice >= 100 ? `₹${(calculatedPrice / 100).toFixed(2)} Cr` : `₹${calculatedPrice} Lakhs`;

                listings.push({
                    id: i,
                    title: `${prefix} ${suffix}`,
                    region: region,
                    subLocality: subLocality,
                    configuration: config,
                    status: status,
                    price: formattedPrice,
                    image: img,
                    carpetArea: `${carpetArea} Sq. Ft.`,
                    possession: possession,
                    address: `Sector ${((i * 3) % 20) + 1}, Near High Street, ${subLocality}, ${region}`,
                    amenities: [AMENITIES_POOL[i % AMENITIES_POOL.length], AMENITIES_POOL[(i + 3) % AMENITIES_POOL.length], AMENITIES_POOL[(i + 6) % AMENITIES_POOL.length]]
                });
            }
            return listings;
        };

        // --- SEARCH & FILTER COMPONENT ---
        function SearchFilterBar({ search, setSearch, selectedRegion, setSelectedRegion, selectedSubLocality, setSelectedSubLocality, selectedConfig, setSelectedConfig, selectedStatus, setSelectedStatus }) {
            return (
                <div className="bg-luxury-card border border-neutral-800 p-6 rounded-xl space-y-4 lg:space-y-0 lg:flex lg:gap-4 items-center shadow-xl w-full">
                    <div className="flex-1 min-w-[200px]">
                        <input 
                            type="text" 
                            placeholder="Search by project name, builder, or location..." 
                            className="w-full bg-luxury-bg border border-neutral-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-luxury-gold text-white" 
                            value={search} 
                            onChange={(e) => setSearch(e.target.value)} 
                        />
                    </div>
                    <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 lg:flex lg:gap-3">
                        <select 
                            className="bg-luxury-bg border border-neutral-800 rounded-lg px-3 py-3 text-sm focus:border-luxury-gold text-luxury-textMuted lg:w-44"
                            value={selectedRegion} 
                            onChange={(e) => { setSelectedRegion(e.target.value); setSelectedSubLocality(""); }}
                        >
                            <option value="">All Cities / Regions</option>
                            {Object.keys(REGIONS).map(r => <option key={r} value={r}>{r}</option>)}
                        </select>

                        <select 
                            className="bg-luxury-bg border border-neutral-800 rounded-lg px-3 py-3 text-sm focus:border-luxury-gold text-luxury-textMuted lg:w-48"
                            value={selectedSubLocality} 
                            disabled={!selectedRegion}
                            onChange={(e) => setSelectedSubLocality(e.target.value)}
                        >
                            <option value="">All Localities</option>
                            {selectedRegion && REGIONS[selectedRegion].map(sub => <option key={sub} value={sub}>{sub}</option>)}
                        </select>

                        <select 
                            className="bg-luxury-bg border border-neutral-800 rounded-lg px-3 py-3 text-sm focus:border-luxury-gold text-luxury-textMuted lg:w-40"
                            value={selectedConfig} 
                            onChange={(e) => setSelectedConfig(e.target.value)}
                        >
                            <option value="">BHK Configuration</option>
                            {CONFIGURATIONS.map(c => <option key={c} value={c}>{c}</option>)}
                        </select>

                        <select 
                            className="bg-luxury-bg border border-neutral-800 rounded-lg px-3 py-3 text-sm focus:border-luxury-gold text-luxury-textMuted lg:w-44"
                            value={selectedStatus} 
                            onChange={(e) => setSelectedStatus(e.target.value)}
                        >
                            <option value="">Possession Status</option>
                            {DEVELOPMENT_STATUS.map(s => <option key={s} value={s}>{s}</option>)}
                        </select>
                    </div>
                </div>
            );
        }

        // --- ENQUIRY MODAL / SITE VISIT POPUP ---
        function EnquiryModal({ property, onClose, onSubmitLead, formTitle = "Book a Free Site Visit" }) {
            const [name, setName] = React.useState("");
            const [phone, setPhone] = React.useState("");
            const [email, setEmail] = React.useState("");
            const [date, setDate] = React.useState("");
            const [notes, setNotes] = React.useState("");

            const handleFormSubmit = (e) => {
                e.preventDefault();
                const newLead = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString(),
                    clientName: name,
                    clientPhone: phone,
                    clientEmail: email,
                    assetTitle: property ? property.title : "General Home Page Request",
                    assetLocation: property ? `${property.subLocality}, ${property.region}` : "Multiple Locations Interest",
                    clientNotes: `Preferred Visit Date: ${date || 'Not specified'}. ${notes}`,
                    status: "New Lead"
                };
                onSubmitLead(newLead);
                
                const customMessage = `Hello TruePillar Realty, my name is ${name}. I want to book a free site visit ${property ? `for the project: "${property.title}" in ${property.subLocality}` : 'to look at premium properties'}. ${date ? `Preferred Date: ${date}` : ''}. Please call me back with layout plans.`;
                window.open(`https://wa.me/917718847841?text=${encodeURIComponent(customMessage)}`, '_blank');
                onClose();
            };

            return (
                <div className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4">
                    <div className="bg-luxury-card border border-neutral-800 rounded-2xl w-full max-w-lg p-6 relative">
                        <button onClick={onClose} className="absolute top-4 right-4 text-neutral-400 hover:text-white text-xl">&times;</button>
                        <span className="text-[10px] uppercase font-bold tracking-widest text-luxury-gold">Verified Buyer Service</span>
                        <h3 className="text-xl font-medium mt-1 mb-4 text-white">{formTitle}</h3>
                        
                        {property && (
                            <div className="grid grid-cols-2 gap-2 bg-luxury-bg p-3 rounded-lg text-xs text-neutral-400 mb-4 border border-neutral-900">
                                <div>📍 Location: <span className="text-white">{property.subLocality}</span></div>
                                <div>📐 Area: <span className="text-white">{property.carpetArea}</span></div>
                                <div>🔑 Status: <span className="text-white">{property.status}</span></div>
                                <div>💰 Price: <span className="text-white font-semibold text-luxury-gold">{property.price}</span></div>
                            </div>
                        )}

                        <form onSubmit={handleFormSubmit} className="space-y-4 text-sm text-neutral-200">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Your Full Name *</label>
                                    <input type="text" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-white" value={name} onChange={e => setName(e.target.value)} required />
                                </div>
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Phone / WhatsApp Number *</label>
                                    <input type="tel" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-white" value={phone} onChange={e => setPhone(e.target.value)} required />
                                </div>
                            </div>
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Email Address *</label>
                                    <input type="email" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-white" value={email} onChange={e => setEmail(e.target.value)} required />
                                </div>
                                <div>
                                    <label className="block text-xs text-neutral-400 mb-1">Preferred Visit Date</label>
                                    <input type="date" className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-neutral-400" value={date} onChange={e => setDate(e.target.value)} />
                                </div>
                            </div>
                            <div>
                                <label className="block text-xs text-neutral-400 mb-1">Any Specific Requirements? (Optional)</label>
                                <textarea rows="2" placeholder="e.g., Looking for higher floor, vastu compliant, ready to move in..." className="w-full bg-luxury-bg border border-neutral-800 rounded p-2.5 focus:outline-none focus:border-luxury-gold text-white resize-none" value={notes} onChange={e => setNotes(e.target.value)}></textarea>
                            </div>
                            <button type="submit" className="w-full bg-luxury-gold hover:bg-luxury-goldHover text-black py-3 rounded font-bold uppercase tracking-wider transition text-xs shadow-lg">Confirm & Book Free Site Visit</button>
                        </form>
                    </div>
                </div>
            );
        }

        // --- PROPERTY CARD VIEW ---
        function PropertyCard({ property, onOpenEnquiry }) {
            return (
                <div className="bg-luxury-card rounded-xl overflow-hidden border border-neutral-800 hover:border-luxury-gold/40 transition-all duration-300 group flex flex-col justify-between shadow-xl">
                    <div className="relative overflow-hidden h-56 bg-neutral-900">
                        <img src={property.image} alt={property.title} className="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" />
                        <span className="absolute top-4 left-4 px-3 py-1 text-[10px] tracking-widest uppercase rounded-full font-bold bg-black/80 text-luxury-gold border border-luxury-gold/30">{property.status}</span>
                        <span className="absolute bottom-3 right-3 px-2 py-0.5 text-[10px] rounded bg-neutral-900/90 text-white font-medium">📐 {property.carpetArea}</span>
                    </div>
                    <div className="p-6 flex-grow flex flex-col justify-between">
                        <div>
                            <div className="flex justify-between items-center mb-1">
                                <span className="text-[11px] text-luxury-gold font-bold uppercase tracking-widest">{property.configuration}</span>
                                <span className="text-xs text-neutral-400 font-medium">📍 {property.subLocality}</span>
                            </div>
                            <h3 className="text-lg font-medium text-white group-hover:text-luxury-gold transition mb-2">{property.title}</h3>
                            <p className="text-xs text-luxury-textMuted font-light line-clamp-2 mb-3">{property.address}</p>
                            <div className="text-xs text-neutral-400 font-light mb-4 flex items-center gap-1">🔑 Possession: <span className="text-white font-medium">{property.possession}</span></div>
                            
                            <div className="flex flex-wrap gap-1.5 mb-4">
                                {property.amenities.map((am, index) => (
                                    <span key={index} className="text-[10px] bg-luxury-bg border border-neutral-900 text-neutral-400 px-2 py-0.5 rounded-md">{am}</span>
                                ))}
                            </div>
                        </div>
                        <div className="pt-4 border-t border-neutral-900 flex justify-between items-center mt-auto">
                            <div><span className="text-xl font-bold text-white tracking-tight">{property.price}</span></div>
                            <button onClick={() => onOpenEnquiry(property)} className="bg-luxury-gold hover:bg-luxury-goldHover text-black text-xs font-bold px-4 py-2.5 rounded transition duration-200 tracking-wider uppercase shadow-md">Book Site Visit</button>
                        </div>
                    </div>
                </div>
            );
        }

        // --- NAVIGATION BAR ---
        function Navbar({ currentView, setView }) {
            const navLabels = {
                'home': 'Home',
                'properties': 'Properties',
                'about': 'About Us',
                'contact': 'Contact Us',
                'admin': '🔒 Agent Login'
            };

            return (
                <nav className="sticky top-0 z-40 border-b border-neutral-900 bg-luxury-bg/95 backdrop-blur px-6 lg:px-16 py-4 flex flex-col md:flex-row gap-4 justify-between items-center">
                    <div className="cursor-pointer text-center md:text-left" onClick={() => setView('home')}>
                        <span className="text-xl font-bold tracking-widest text-white">TRUEPILLAR <span className="text-luxury-gold">REALTY</span></span>
                        <div className="text-[10px] tracking-widest text-luxury-textMuted uppercase block font-semibold">Trust • Transparency • Zero Brokerage</div>
                    </div>
                    
                    <div className="flex flex-wrap justify-center gap-6 text-xs tracking-wider uppercase font-semibold">
                        {['home', 'properties', 'about', 'contact', 'admin'].map((viewId) => (
                            <button 
                                key={viewId} 
                                onClick={() => setView(viewId)} 
                                className={`hover:text-luxury-gold transition duration-200 ${currentView === viewId ? 'text-luxury-gold font-bold border-b border-luxury-gold/50' : 'text-neutral-400'}`}
                            >
                                {navLabels[viewId]}
                            </button>
                        ))}
                    </div>

                    <div className="flex gap-3 items-center">
                        <a href="https://www.facebook.com/TruePillarRealty/" target="_blank" rel="noreferrer" className="text-neutral-400 hover:text-luxury-gold text-sm transition">
                            Facebook
                        </a>
                        <span className="text-neutral-800">|</span>
                        <a href="https://www.instagram.com/truepillar.realty/" target="_blank" rel="noreferrer" className="text-neutral-400 hover:text-luxury-gold text-sm transition">
                            Instagram
                        </a>
                    </div>
                </nav>
            );
        }

        // --- HOME SCREEN VIEW ---
        function Home({ setView, listings, onOpenEnquiry, filterState, onSubmitHomeLead }) {
            const [hName, setHName] = React.useState("");
            const [hPhone, setHPhone] = React.useState("");
            const [hLoc, setHLoc] = React.useState("Navi Mumbai");

            const handleHomeForm = (e) => {
                e.preventDefault();
                const newLead = {
                    id: Date.now(),
                    timestamp: new Date().toLocaleString(),
                    clientName: hName,
                    clientPhone: hPhone,
                    clientEmail: "N/A (Home Form)",
                    assetTitle: `Home Page Quick Booking`,
                    assetLocation: hLoc,
                    clientNotes: `Client requested a direct builder consultation & site visit coordinates for properties in ${hLoc}.`,
                    status: "New Lead"
                };
                onSubmitHomeLead(newLead);
                
                const customMsg = `Hello TruePillar Realty, my name is ${hName}. I would like to schedule a free site visit to look at properties in ${hLoc}. Please send me the top project brochures.`;
                window.open(`https://wa.me/917718847841?text=${encodeURIComponent(customMsg)}`, '_blank');
                
                setHName("");
                setHPhone("");
                alert("Site Visit Request Logged! We are launching your chat connection now.");
            };

            return (
                <div className="space-y-12">
                    {/* Hero Split Section */}
                    <section className="max-w-7xl mx-auto px-6 lg:px-16 pt-12 pb-6 grid grid-cols-1 lg:grid-cols-5 gap-12 items-center">
                        <div className="lg:col-span-3 space-y-6 text-center lg:text-left">
                            <span className="inline-block px-3 py-1 bg-neutral-900 border border-neutral-800 text-luxury-gold text-xs tracking-widest uppercase rounded-full font-bold">Premium Residential Properties</span>
                            <h1 className="text-4xl md:text-6xl font-light tracking-tight leading-tight text-white">Find Your Dream Home with <span className="text-luxury-gold font-bold">Zero Brokerage</span></h1>
                            <p className="text-luxury-textMuted max-w-xl mx-auto lg:mx-0 text-sm md:text-base font-light">Explore handpicked residential landmarks across Mumbai, Thane, Navi Mumbai, and Dombivli. Buy directly from top developers with absolute trust, clarity, and zero brokerage fees.</p>
                            <div className="flex gap-4 justify-center lg:justify-start">
                                <button onClick={() => setView('properties')} className="bg-luxury-gold hover:bg-luxury-goldHover text-black px-8 py-3 rounded-lg font-bold tracking-wider transition uppercase text-xs">Browse Properties</button>
                            </div>
                        </div>

                        {/* Inline Home Booking Card Form */}
                        <div className="lg:col-span-2 bg-luxury-card border border-neutral-800 p-6 rounded-2xl shadow-2xl space-y-4">
                            <div className="text-center lg:text-left">
                                <h3 className="text-lg font-bold text-white tracking-wide">Book a Free Site Visit</h3>
                                <p className="text-xs text-luxury-textMuted font-light">Get free pickup, developer pricing sheets, and direct tours.</p>
                            </div>
                            <form onSubmit={handleHomeForm} className="space-y-3 text-xs text-neutral-300">
                                <div>
                                    <input type="text" placeholder="Your Name" className="w-full bg-luxury-bg border border-neutral-800 rounded p-3 focus:outline-none focus:border-luxury-gold text-white" value={hName} onChange={e => setHName(e.target.value)} required />
                                </div>
                                <div>
                                    <input type="tel" placeholder="Mobile Number" className="w-full bg-luxury-bg border border-neutral-800 rounded p-3 focus:outline-none focus:border-luxury-gold text-white" value={hPhone} onChange={e => setHPhone(e.target.value)} required />
                                </div>
                                <div>
                                    <select className="w-full bg-luxury-bg border border-neutral-800 rounded p-3 text-luxury-textMuted focus:border-luxury-gold" value={hLoc} onChange={e => setHLoc(e.target.value)}>
                                        {Object.keys(REGIONS).map(r => <option key={r} value={r}>Target Location: {r}</option>)}
                                    </select>
                                </div>
                                <button type="submit" className="w-full bg-luxury-gold hover:bg-luxury-goldHover text-black py-3 rounded font-bold uppercase tracking-widest transition shadow-lg mt-2">Schedule Free Tour</button>
                            </form>
                        </div>
                    </section>

                    {/* Integrated Search Filters Layout */}
                    <section id="search-section" className="px-6 lg:px-16 max-w-7xl mx-auto">
                        <div className="mb-4"><h3 className="text-xs uppercase font-bold text-luxury-gold tracking-widest">Filter Real Estate Inventory</h3></div>
                        <SearchFilterBar {...filterState} />
                    </section>

                    {/* Featured Grid Layout */}
                    <section className="py-6 px-6 lg:px-16 max-w-7xl mx-auto">
                        <div className="flex justify-between items-end mb-8 border-b border-neutral-900 pb-4">
                            <h2 className="text-xl md:text-2xl font-light tracking-wider">Premium Featured <span className="text-luxury-gold font-medium">Projects</span></h2>
                            <button onClick={() => setView('properties')} className="text-xs text-luxury-gold font-bold tracking-wider uppercase hover:underline">View All Flats ({listings.length}) &rarr;</button>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                            {listings.slice(0, 6).map(p => <PropertyCard key={p.id} property={p} onOpenEnquiry={onOpenEnquiry} />)}
                        </div>
                    </section>
                </div>
            );
        }

        // --- PROPERTIES CATALOGUE VIEW ---
        function Properties({ listings, onOpenEnquiry, filterState }) {
            return (
                <div className="bg-luxury-bg text-white min-h-screen py-12 px-6 lg:px-16 max-w-7xl mx-auto space-y-8">
                    <div>

                                    onDeleteLead={(id) => setLeads(leads.filter(l => l.id !== id))}
                                    onUpdateLeadStatus={(id, status) => setLeads(leads.map(l => l.id === id ? { ...l, status } : l))}
                                    onLogout={() => setIsAuthenticated(false)}
                                />
                            )
                        )}
                    </main>

                    <footer className="border-t border-neutral-900 bg-luxury-card py-12 px-6 lg:px-16 text-xs text-luxury-textMuted">
                        <div className="max-w-7xl mx-auto grid grid-cols-1 md:grid-cols-4 gap-8">
                            <div className="space-y-3">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">TruePillar Realty</h4>
                                <p className="font-light leading-relaxed">Your premium home consultancy partner across Mumbai Metropolitan micro-markets. Verified developer properties with absolute Zero Brokerage execution frameworks.</p>
                            </div>
                            <div className="space-y-2 font-light">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">Quick Contacts</h4>
                                <div>📞 Phone Desk: +91 7718847841</div>
                                <div>✉️ Support: sales@truepillar.in</div>
                                <div>📍 Kharghar, Navi Mumbai</div>
                            </div>
                            <div className="space-y-2 font-light">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">Follow Our Pages</h4>
                                <div><a href="https://www.facebook.com/TruePillarRealty/" target="_blank" rel="noreferrer" className="hover:text-luxury-gold transition">➡️ Facebook Page</a></div>
                                <div><a href="https://www.instagram.com/truepillar.realty/" target="_blank" rel="noreferrer" className="hover:text-luxury-gold transition">➡️ Instagram Feed</a></div>
                            </div>
                            <div className="space-y-2">
                                <h4 className="text-white font-bold tracking-wider uppercase text-sm">Regulatory & Compliance</h4>
                                <p className="font-light">© 2026 TruePillar Realty. All transactional support conforms with standard MAHA-RERA consumer protection metrics.</p>
                            </div>
                        </div>
                    </footer>

                    {activeEnquiryTarget && (
                        <EnquiryModal 
                            property={activeEnquiryTarget} 
                            onClose={() => setActiveEnquiryTarget(null)} 
                            onSubmitLead={(newLead) => setLeads([newLead, ...leads])}
                        />
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
