        const buildRequestedProjectSeeds = () => TP_REQUESTED_PROJECTS.map((item) => {

                id: "tp-seed-" + slug,
                slug,
                title: item.title,

                region: ["Alibaug", "Khopoli", "Karjat", "Chouk", "Karjat-Khopoli Marg", "Pimploli BK"].includes(item.locality) ? "Raigad" : "Navi Mumbai",
                subLocality: item.locality,

        // Include all locality labels supplied for the bulk project inventory in the location filter.
        REGIONS["Navi Mumbai"] = [...new Set([...REGIONS["Navi Mumbai"], ...TP_REQUESTED_LOCALITIES])];

            if (IS_LOCAL_FILE) return { type: "view", view: "home" };
            const path = window.location.pathname.replace(/\/+$/, "") || "/";
            if (path === "/") return { type: "view", view: "home" };
            if (path === "/properties") return { type: "view", view: "properties" };
            if (path === "/about") return { type: "view", view: "about" };
            if (path === "/contact") return { type: "view", view: "contact" };
            if (path === "/admin") return { type: "view", view: "admin" };
            const slugMatch = path.match(/^\/([^/]+)$/);
            if (slugMatch) return { type: "project", slug: decodeURIComponent(slugMatch[1]) };
            return { type: "view", view: "home" };
        };

        const navigateToProjectUrl = (p) => {

        const lines = (text = "") => text.split("\n").map(x => x.trim()).filter(Boolean);
        const pairs = (text = "") => lines(text).map(row => {

        const normalizeProject = (p) => ({

            videos: Array.isArray(p.videos) ? p.videos : [],

            configurations: (Array.isArray(p.configurations) && p.configurations.length ? p.configurations : [{ configuration: p.configuration || "", carpetArea: p.carpetArea || "", price: p.price || "" }]).map(c => ({

                highlightVideoLinks: Array.isArray(c.highlightVideoLinks) ? c.highlightVideoLinks : [],

        const projectLink = p => `${location.origin}/${p.slug || slugify(p.title)}`;
        const projectConfigurations = p => (Array.isArray(p.configurations) && p.configurations.length ? p.configurations : [{configuration:p.configuration||"",carpetArea:p.carpetArea||"",price:p.price||""}]).filter(x=>x&&(x.configuration||x.carpetArea||x.price));
        const projectMatchesConfiguration = (p,c) => !c || projectConfigurations(p).some(x=>String(x.configuration||"").toLowerCase()===String(c).toLowerCase());
        const projectConfigSummary = p => [...new Set(projectConfigurations(p).map(x=>x.configuration).filter(Boolean))].join(", ") || p.configuration || "";
        const projectStartingPrice = p => projectConfigurations(p)[0]?.price || p.price || "";
        const projectAreaSummary = p => { const a=projectConfigurations(p).map(x=>x.carpetArea).filter(Boolean); return a.length>1 ? `${a[0]} onwards` : (a[0]||p.carpetArea||""); };
        const projectCardSampleVideo = (p, selectedConfig="") => {

            const matched=selectedConfig ? configs.find(c=>String(c.configuration||"").toLowerCase()===String(selectedConfig).toLowerCase()) : null;
            if(matched?.sampleVideoLinks?.length) return matched.sampleVideoLinks[0];
            const anyConfig=configs.find(c=>c?.sampleVideoLinks?.length);
            return anyConfig?.sampleVideoLinks?.[0] || p.sampleVideoLinks?.[0] || "";
        };
        const getActiveConfiguration = (p, selectedConfig) => projectConfigurations(p).find(x=>String(x.configuration||"").toLowerCase()===String(selectedConfig||"").toLowerCase()) || projectConfigurations(p)[0] || {};

        // --- AUTOMATED PROPERTIES POPULATER ---
        const compileInitialListings = () => {
            const listings = [];
            const regionKeys = Object.keys(REGIONS);
            
            for (let i = 1; i <= 85; i++) {
                const region = regionKeys[(i - 1) % regionKeys.length];
                const subLocalities = REGIONS[region];
                const subLocality = subLocalities[(i - 1) % subLocalities.length];
                const config = CONFIGURATIONS[(i - 1) % CONFIGURATIONS.length];
                const status = DEVELOPMENT_STATUS[i % DEVELOPMENT_STATUS.length];
                const prefix = TITLE_PREFIXES[(i * 3) % TITLE_PREFIXES.length];
                const suffix = TITLE_SUFFIXES[(i * 7) % TITLE_SUFFIXES.length];
                const img = STOCK_IMAGES[i % STOCK_IMAGES.length];
                
                let carpetArea = 450 + ((i * 15) % 1800);
                let possession = status === "Ready to Move" ? "Ready" : `Dec 20${26 + (i % 4)}`;
                
                let basePrice = config.includes("1 BHK") ? 55 : (config.includes("2 BHK") ? 95 : (config.includes("3 BHK") ? 160 : 280));
                let regionalMultiplier = region === "Mumbai" ? 2.3 : (region === "Thane" ? 1.25 : (region === "Navi Mumbai" ? 1.0 : 0.7));
                let calculatedPrice = Math.round(basePrice * regionalMultiplier);
                let formattedPrice = calculatedPrice >= 100 ? `₹${(calculatedPrice / 100).toFixed(2)} Cr` : `₹${calculatedPrice} Lakhs`;

                listings.push({
                    id: i,
                    title: `${prefix} ${suffix}`,
                    region: region,
                    subLocality: subLocality,
                    configuration: config,
                    status: status,
                    price: formattedPrice,
                    image: img,
                    carpetArea: `${carpetArea} Sq. Ft.`,
                    possession: possession,

                    amenities: [AMENITIES_POOL[i % AMENITIES_POOL.length], AMENITIES_POOL[(i + 3) % AMENITIES_POOL.length], AMENITIES_POOL[(i + 6) % AMENITIES_POOL.length]]
                });
            }
            return listings;

        // --- SEARCH & FILTER COMPONENT ---
        function SearchFilterBar({ listings = [], search, setSearch, selectedRegion, setSelectedRegion, selectedSubLocality, setSelectedSubLocality, selectedConfig, setSelectedConfig, selectedStatus, setSelectedStatus }) {

                        <input type="text" placeholder="Search project, location, city, developer..." className="w-full bg-luxury-bg border border-neutral-800 rounded-lg px-4 py-3 text-sm focus:outline-none focus:border-luxury-gold text-white" value={search} onChange={(e)=>{setSearch(e.target.value);setSuggestionsOpen(true)}} />
                        {search.trim() && suggestionsOpen && <div className="absolute left-0 right-0 top-full mt-2 bg-[#111114] border border-neutral-700 rounded-lg shadow-2xl max-h-80 overflow-y-auto">{(()=>{
                            const q=search.toLowerCase(), seen=new Set(), items=[];
                            const add=(type,label,detail)=>{if(label&&label.toLowerCase().includes(q)){const k=(type+label).toLowerCase();if(!seen.has(k)){seen.add(k);items.push({type,label,detail})}}};
                            listings.filter(p=>p.published!==false).forEach(p=>{add("Project",p.title,`${p.subLocality}, ${p.region}`);add("Location",p.subLocality,p.region);add("City",p.region,"All matching projects");add("Developer",p.developer,p.title);add("Address",p.address,p.title)});
                            return items.slice(0,12).length ? items.slice(0,12).map((s,i)=><button type="button" key={i} onClick={()=>{setSearch(s.label);setSuggestionsOpen(false)}} className="w-full text-left px-4 py-3 border-b border-neutral-800 last:border-0 hover:bg-neutral-900 flex gap-3"><span className="text-[9px] uppercase text-luxury-gold border border-luxury-gold/40 rounded px-1.5 py-0.5 h-fit min-w-[58px] text-center">{s.type}</span><span><strong className="block text-sm text-white">{s.label}</strong><small className="text-neutral-500">{s.detail}</small></span></button>) : <div className="px-4 py-4 text-sm text-neutral-500">No matching project or location found.</div>;

        const openProjectPdf = (pdf) => {
            try {
                if (!pdf || !pdf.url) return;
                if (!pdf.url.startsWith("data:application/pdf")) { window.open(pdf.url, "_blank"); return; }
                const parts = pdf.url.split(",");
                const meta = parts[0] || "";
                const data = parts.slice(1).join(",");
                let blob;
                if (meta.includes(";base64")) {
                    const binary = atob(data);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
                    blob = new Blob([bytes], { type: "application/pdf" });
                } else { blob = new Blob([decodeURIComponent(data)], { type: "application/pdf" }); }
                const blobUrl = URL.createObjectURL(blob);
                window.open(blobUrl, "_blank");
                setTimeout(() => URL.revokeObjectURL(blobUrl), 60000);
            } catch (err) { console.error("PDF open error:", err); alert("Could not open this PDF. Please upload it again."); }
        };

                e.preventDefault(); setError(""); setSuccess("");

                            <div className="flex justify-between gap-3 pt-1"><button type="button" onClick={()=>{setMode("forgot");setError("");setSuccess("")}} className="text-luxury-gold hover:underline">Forgot Password?</button><button type="button" onClick={()=>{setMode("change");setError("");setSuccess("")}} className="text-luxury-gold hover:underline">Change Password</button></div>

        function TopSpotlight({ listings=[], onOpenProject, onOpenEnquiry }) {

            const ids=Array.isArray(settings.projectIds)?settings.projectIds.slice(0,5).filter(Boolean):[];
            const chosen=ids.map(id=>listings.find(x=>String(x.id)===String(id))).filter(Boolean); const pool=chosen.length?chosen:listings.filter(x=>x.published!==false).slice(0,5);
            const [slide,setSlide]=React.useState(0);
            React.useEffect(()=>{if(pool.length<2)return;const timer=setInterval(()=>setSlide(x=>(x+1)%pool.length),15000);return()=>clearInterval(timer)},[pool.length]);
            if(!pool.length)return null;
            const project=pool[slide%pool.length], configs=projectConfigurations(project);

              <div className="p-7 md:p-9 flex flex-col justify-center"><div className="text-luxury-gold text-[10px] font-bold tracking-[.22em]">PROJECT • VIDEO • OFFER</div><h3 className="text-2xl font-black mt-2">{settings.heading||"THIS WEEK'S PROPERTY SPOTLIGHT"}</h3><p className="text-sm text-gray-300 leading-6 mt-3">{settings.offerText||"Get the latest developer offer, verified inventory and priority site-visit assistance."}</p><p className="text-xs text-gray-400 leading-5 mt-3">{settings.benefits||"Zero brokerage • Verified pricing • Loan assistance • Pickup & drop for site visit"}</p><div className="grid sm:grid-cols-2 gap-3 mt-5"><button onClick={()=>onOpenProject(project)} className="bg-luxury-gold text-black font-bold py-3 rounded">VIEW PROJECT</button>{video&&<a href={video} target="_blank" rel="noopener noreferrer" className="border border-luxury-gold text-luxury-gold font-bold py-3 rounded text-center">▶ WATCH VIDEO</a>}<button onClick={()=>onOpenEnquiry(project)} className="sm:col-span-2 border border-white/20 py-3 rounded font-bold">GET LATEST OFFER / SCHEDULE VISIT</button></div>{pool.length>1&&<div className="flex gap-2 mt-5">{pool.map((_,i)=><button key={i} onClick={()=>setSlide(i)} className={`h-2 rounded-full ${i===slide?"w-7 bg-luxury-gold":"w-2 bg-white/30"}`}></button>)}</div>}</div>

        function App() {
            const [view, setView] = React.useState('home');
            const [activeProject, setActiveProject] = React.useState(null);
            const [isAuthenticated, setIsAuthenticated] = React.useState(false);
            
            const [listings, setListings] = React.useState([]);
            const [leads, setLeads] = React.useState([]);
            const [cloudReady, setCloudReady] = React.useState(false);
            const requestedSeedAttempted = React.useRef(false);

            const [search, setSearch] = React.useState("");
            const [selectedRegion, setSelectedRegion] = React.useState("");
            const [selectedSubLocality, setSelectedSubLocality] = React.useState("");
            const [selectedConfig, setSelectedConfig] = React.useState("");
            const [projectConfigContext, setProjectConfigContext] = React.useState("");
            const [selectedStatus, setSelectedStatus] = React.useState("");
            const [activeEnquiryTarget, setActiveEnquiryTarget] = React.useState(null);

            React.useEffect(() => {
                let projectsLoaded = false;
                let leadsLoaded = false;

                const markReady = () => {
                    if (projectsLoaded && leadsLoaded) setCloudReady(true);
                };

                const unsubscribeProjects = projectsCollection.onSnapshot(async snap => {
                    if (snap.empty && !projectsLoaded) {
                        try {
                            const legacy = await legacyCloudDoc.get();
                            const legacyListings = legacy.exists ? (legacy.data().listings || []) : [];
                            if (legacyListings.length) {
                                const batch = db.batch();
                                legacyListings.forEach(item => {
                                    const normalized = normalizeProject(item);
                                    batch.set(projectsCollection.doc(String(normalized.id)), cleanForFirestore(normalized));
                                });
                                await batch.commit();
                                return;
                            }
                        } catch (migrationError) {
                            console.error("Legacy migration failed", migrationError);
                        }
                    }

                    setListings(snap.docs.map(doc => normalizeProject({ ...doc.data(), id: doc.data().id || doc.id })));
                    projectsLoaded = true;
                    markReady();
                }, err => {
                    console.error("Project sync error", err);
                    alert("Project cloud sync failed. Check Firestore rules.");
                });

                const unsubscribeLeads = leadsCollection.orderBy("createdAt", "desc").onSnapshot(snap => {
                    setLeads(snap.docs.map(doc => ({ ...doc.data(), id: doc.data().id || doc.id })));
                    leadsLoaded = true;
                    markReady();
                }, err => {
                    console.error("Lead sync error", err);
                    leadsLoaded = true;
                    markReady();
                });

                return () => {
                    unsubscribeProjects();
                    unsubscribeLeads();
                };
            }, []);

            React.useEffect(() => {
                if (!cloudReady || requestedSeedAttempted.current) return;
                requestedSeedAttempted.current = true;
                const seeds = buildRequestedProjectSeeds();
                const batch = db.batch();
                let writes = 0;
                seeds.forEach(seed => {
                    const existing = listings.find(p => slugify(p.title) + "|" + slugify(p.subLocality || "") === slugify(seed.title) + "|" + slugify(seed.subLocality || ""));
                    if (!existing) {
                        batch.set(projectsCollection.doc(String(seed.id)), cleanForFirestore(seed), { merge: false });
                        writes++;
                        return;
                    }
                    const patch = {};
                    const isBlank = value => value === undefined || value === null || value === "";
                    if ((isBlank(existing.developer) || existing.developer === "To be updated" || existing.developer === "Verified Developer") && seed.developer) patch.developer = seed.developer;
                    if (isBlank(existing.reraNumber) && seed.reraNumber) patch.reraNumber = seed.reraNumber;
                    if ((isBlank(existing.price) || existing.price === "Price on request") && seed.price) patch.price = seed.price;
                    if (isBlank(existing.configuration) && seed.configuration) patch.configuration = seed.configuration;
                    if ((!Array.isArray(existing.configurations) || !existing.configurations.some(c => c && c.configuration)) && seed.configurations) patch.configurations = seed.configurations;
                    if ((isBlank(existing.possession) || existing.possession === "To be updated") && seed.possession) patch.possession = seed.possession;
                    if ((existing.status === "Details Pending" || isBlank(existing.status)) && seed.status) patch.status = seed.status;
                    if ((existing.statusBadge === "Details Pending" || isBlank(existing.statusBadge)) && seed.statusBadge) patch.statusBadge = seed.statusBadge;
                    if ((isBlank(existing.description) || String(existing.description).startsWith("Project listing added to the TruePillar Realty inventory.")) && seed.description) patch.description = seed.description;
                    if ((!Array.isArray(existing.images) || !existing.images.length) && seed.images && seed.images.length) { patch.images = seed.images; patch.image = seed.image || seed.images[0]; }
                    if (isBlank(existing.sourceUrl) && seed.sourceUrl) patch.sourceUrl = seed.sourceUrl;
                    if (Object.keys(patch).length) {
                        batch.set(projectsCollection.doc(String(existing.id)), cleanForFirestore(patch), { merge: true });
                        writes++;
                    }
                });
                if (!writes) return;
                batch.commit().then(() => console.info(`TruePillar project enrichment complete: ${writes} records inserted or enriched with sourced fields.`))
                    .catch(error => console.error("TruePillar project enrichment failed; check Firestore write rules.", error));
            }, [cloudReady, listings]);

            React.useEffect(() => {
                if (IS_LOCAL_FILE) return;
                const applyRoute = () => {
                    const route = getRouteFromPath();
                    if (route.type === "project") {
                        const found = listings.find(p => (p.slug || slugify(p.title)) === route.slug);
                        if (found) { setActiveProject(normalizeProject(found)); setView("project"); }
                        else if (cloudReady) { setActiveProject(null); setView("properties"); }
                    } else {
                        setActiveProject(null);
                        setView(route.view);
                    }
                };
                applyRoute();
                window.addEventListener("popstate", applyRoute);
                return () => window.removeEventListener("popstate", applyRoute);
            }, [listings, cloudReady]);

            const navigateView = (nextView) => {
                const paths = { home: "/", properties: "/properties", about: "/about", contact: "/contact", admin: "/admin" };
                setActiveProject(null);
                setView(nextView);
                if (!IS_LOCAL_FILE) window.history.pushState({ view: nextView }, "", paths[nextView] || "/");
                window.scrollTo(0, 0);
            };

            const openProject = (p, config = "") => {
                const n = normalizeProject(p);
                setActiveProject(n);
                setProjectConfigContext(config);
                setView("project");
                if (!IS_LOCAL_FILE) navigateToProjectUrl(n);
                window.scrollTo(0, 0);
            };

            const closeProject = () => {
                setActiveProject(null);
                setView("properties");
                if (!IS_LOCAL_FILE) window.history.pushState({ view: "properties" }, "", "/properties");
                window.scrollTo(0, 0);
            };

            const saveProject = async (project) => {
                const normalized = normalizeProject(project);
                await projectsCollection.doc(String(normalized.id)).set(cleanForFirestore(normalized), { merge: false });
            };

            const deleteProject = async (id) => {
                await projectsCollection.doc(String(id)).delete();
            };

            const saveLead = async (lead) => {
                const payload = cleanForFirestore({ ...lead, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
                await leadsCollection.doc(String(lead.id)).set(payload);
            };

            const deleteLead = async (id) => {
                await leadsCollection.doc(String(id)).delete();
            };

<script>
document.addEventListener("click",function(e){
 const trigger=e.target.closest("[data-tp-visit-trigger]");
 if(trigger){
   const panel=trigger.closest(".tp-v20-visit-panel");
   if(panel){panel.classList.add("tp-v20-open");setTimeout(()=>panel.querySelector("input")?.focus(),50);}
 }
 const close=e.target.closest("[data-tp-visit-close]");
 if(close){close.closest(".tp-v20-visit-panel")?.classList.remove("tp-v20-open");}
});
function tpV20CollapseVisit(){
 const headings=[...document.querySelectorAll("h1,h2,h3")];
 const heading=headings.find(x=>x.textContent.trim().toUpperCase().includes("BOOK A FREE SITE VISIT"));
 if(!heading)return;
 const panel=heading.closest("form")?.parentElement || heading.parentElement;
 if(!panel || panel.classList.contains("tp-v20-visit-panel"))return;
 panel.classList.add("tp-v20-visit-panel");
 const children=[...panel.children];
 children.forEach(el=>el.classList.add("tp-v20-visit-form"));
 const btn=document.createElement("button");
 btn.type="button";btn.setAttribute("data-tp-visit-trigger","");
 btn.className="tp-v20-visit-trigger w-full bg-luxury-gold text-black font-bold py-4 px-6 rounded";
 btn.textContent="SCHEDULE FREE SITE VISIT";
 panel.insertBefore(btn,panel.firstChild);
 const close=document.createElement("button");
 close.type="button";close.setAttribute("data-tp-visit-close","");
 close.className="tp-v20-visit-form w-full mt-2 border border-white/20 py-2 rounded text-xs";
 close.textContent="CLOSE FORM";
 panel.appendChild(close);
}
setTimeout(tpV20CollapseVisit,250);
</script>
